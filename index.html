<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공싸움</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; }
  canvas { background: #1c1c24; border: 4px solid #eee; max-width: 96vmin; max-height: 96vmin; }
</style>
</head>
<body>
<canvas id="arena" width="2400" height="2400"></canvas>

<script>
// ===== 설정 =====
const CONFIG = {
  arenaSize: 2400,       // 정사각형 경기장 한 변 (px)
  gravity: 1800,         // 중력 (px/s^2)
  bounceHeight: 450,     // 바닥에서 튕겨 오르는 높이 (px) - 항상 일정
  boxW: 444,             // 네모 공 가로 (이미지 크기)
  boxH: 311,             // 네모 공 세로 (이미지 크기)
  startSpeedX: 300,      // 시작 가로 속도 (px/s)
  imageSrc: "ball.webp", // 공 이미지
};

const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");
canvas.width = canvas.height = CONFIG.arenaSize;

const img = new Image();
let imgLoaded = false;
img.onload = () => { imgLoaded = true; };
img.src = CONFIG.imageSrc;

// 바닥에서 튕길 때의 고정 속도: v = sqrt(2 * g * h)  -> 매번 같은 높이까지 올라감
const BOUNCE_SPEED = Math.sqrt(2 * CONFIG.gravity * CONFIG.bounceHeight);

// x, y = 네모의 왼쪽 위 모서리
const box = {
  x: (CONFIG.arenaSize - CONFIG.boxW) / 2,
  y: 100,
  vx: CONFIG.startSpeedX,
  vy: 0,
  w: CONFIG.boxW,
  h: CONFIG.boxH,
};

function step(dt) {
  const S = CONFIG.arenaSize;

  // 중력
  box.vy += CONFIG.gravity * dt;
  box.x += box.vx * dt;
  box.y += box.vy * dt;

  // 좌우 벽: 속도 방향만 반전
  if (box.x < 0)           { box.x = 0;           box.vx =  Math.abs(box.vx); }
  if (box.x + box.w > S)   { box.x = S - box.w;   box.vx = -Math.abs(box.vx); }

  // 천장
  if (box.y < 0)           { box.y = 0;           box.vy =  Math.abs(box.vy); }

  // 바닥: 항상 같은 속도로 튕김 -> 튕기는 높이 일정
  if (box.y + box.h > S)   { box.y = S - box.h;   box.vy = -BOUNCE_SPEED; }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (imgLoaded) {
    ctx.drawImage(img, box.x, box.y, box.w, box.h);
  } else {
    ctx.fillStyle = "#ff5c8a";
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.strokeRect(box.x, box.y, box.w, box.h);
}

// 고정 시간 간격으로 물리 계산 (프레임 속도와 상관없이 일정하게 동작)
const FIXED_DT = 1 / 240;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  while (acc >= FIXED_DT) { step(FIXED_DT); acc -= FIXED_DT; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
