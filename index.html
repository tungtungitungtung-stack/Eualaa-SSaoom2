<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공싸움</title>
<style>
  :root { --side: min(96vw, calc(100vh - 200px)); }
  @supports (height: 100dvh) { :root { --side: min(96vw, calc(100dvh - 200px)); } }
  html, body { margin: 0; background: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { min-height: 100vh; padding: 8px 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .bar { width: var(--side); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
  .top { position: sticky; top: 0; z-index: 5; background: #fff; padding: 2px 0; }
  .grp { display: flex; flex-wrap: wrap; gap: 6px; }
  canvas { background: #fff; border: 4px solid #000; box-sizing: border-box; width: var(--side); height: auto; aspect-ratio: 1 / 1; }
  button { font-size: 16px; font-weight: bold; padding: 8px 14px; border: 2px solid #000; border-radius: 8px; background: #fff; color: #000; cursor: pointer; }
  button:hover:not(:disabled) { background: #000; color: #fff; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #recStatus { font-size: 14px; font-weight: bold; color: #000; }
  #recStatus.recording { color: #e11; }
  #overlay { position: fixed; inset: 0; background: rgba(255,255,255,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  #overlay[hidden] { display: none; }
  #picker { position: fixed; inset: 0; background: rgba(255,255,255,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 20; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  #picker[hidden] { display: none; }
  #pickerTitle { font-size: 24px; font-weight: bold; }
  #pickerList { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .pick { width: 210px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pick img { height: 190px; max-width: 100%; object-fit: contain; }
  .pick .pname { font-size: 22px; }
  .pick .pinfo { font-size: 15px; font-weight: normal; }
  .pick .pdesc { font-size: 13px; font-weight: normal; line-height: 1.35; }
  #replayVideo { max-width: 96vw; max-height: calc(100vh - 100px); border: 4px solid #000; background: #fff; }
  #timer { font-size: 28px; font-weight: bold; font-variant-numeric: tabular-nums; color: #000; }
</style>
</head>
<body>
<div class="bar top">
  <button id="startBtn">시작</button>
  <span id="timer">00:00.0</span>
</div>
<canvas id="arena" width="1600" height="1600"></canvas>
<div class="bar">
  <span id="recStatus">전투 후 영상 저장</span>
  <span class="grp">
    <button id="replayBtn" disabled>▶ 다시보기</button>
    <button id="downloadBtn" disabled>⬇ 다운로드</button>
  </span>
</div>
<div class="bar">
  <button id="addLeft">◀ 캐릭터 추가</button>
  <button id="addRight">캐릭터 추가 ▶</button>
</div>

<div id="picker" hidden>
  <div id="pickerTitle">추가할 캐릭터를 선택하세요</div>
  <div id="pickerList"></div>
  <button id="pickerCancel">취소</button>
</div>

<div id="overlay" hidden>
  <button id="closeOverlay">✕ 닫기</button>
  <video id="replayVideo" controls playsinline></video>
</div>

// 캐릭터 이미지 불러오기
for (const k in TYPES) {
  const t = TYPES[k];
  t.ready = false;
  t.img = new Image();
  t.img.onload = () => { t.ready = true; };
  t.img.src = t.src;

// v = sqrt(2 * g * h) -> 매번 같은 높이까지 올라감
const BOUNCE_SPEED = Math.sqrt(2 * CONFIG.gravity * CONFIG.bounceHeight);
const DOUBLE_JUMP_SPEED = Math.sqrt(2 * CONFIG.gravity * CONFIG.doubleJumpHeight);

// ===== 게임 상태 =====
let chars = [], effects = [], floaters = [], minions = [], shots = [];
let nextId = 1, nextMid = 1, peak = 0, time = 0, shake = 0;
let running = false, over = false, winner = null, sudden = null;

function syncUI() {
  startBtn.textContent = running ? "다시하기" : "시작";
  const full = over || chars.length >= CONFIG.maxCharacters;
  addBtns.forEach(b => { b.disabled = full; });
}

function reset() {
  chars = []; effects = []; floaters = []; minions = []; shots = [];
  nextId = 1; nextMid = 1; peak = 0; time = 0; shake = 0;
  running = false; over = false; winner = null; sudden = null;
  stopRecording(true);
  clearReplay();
  syncUI();
}

function spawn(typeKey, side) {
  if (over || chars.length >= CONFIG.maxCharacters) return;
  const t = TYPES[typeKey], S = CONFIG.arenaSize;
  const id = nextId++;
  const c = {
    id, type: t, name: t.name + " " + id,
    x: Math.random() * (S - t.w),      // 경기장 안 어디든 랜덤
    y: Math.random() * (S - t.h),
    vx: (side === "left" ? 1 : -1) * CONFIG.startSpeedX,
    vy: 0, w: t.w, h: t.h,
    hp: t.hp, alive: true,
    hitCd: {},            // 상대별 평타 쿨타임
    flash: 0,             // 평타가 적중했을 때 깜빡임
    msg: null,            // 머리 위에 잠깐 띄우는 말 {text, t}
    // 동상(얼음) 상태
    frozen: false, frozenT: 0, frostTicks: 0, freezeDur: 0, frostDmg: 0, frostInt: 1,
    // 으아라아 전용
    jumpChecked: false,   // 이번 점프에서 더블점프 판정을 했는지
    doubleJumped: false,  // 더블점프에 성공해서 공중에 있는지
    rageCd: t.rageInterval || 0,
    rage: null,
    djText: 0,
    // 얼음밤 전용
    swordAng: Math.random() * Math.PI * 2,
    iceCd: t.iceInterval || 0,
    // 호원 전용
    jellyCd: t.jellyInterval || 0,
    bunCd: t.bunInterval || 0,
  };
  if (t.balloon) {
    const bx = c.x + c.w / 2, by = Math.max(t.balloon.r, c.y + c.h / 2 - t.balloon.rope);
    c.bal = { x: bx, y: by, px: bx, py: by };     // 풍선 위치 / 이전 위치 (베를레 적분)
  }
  chars.push(c);
  peak = Math.max(peak, chars.length);
  syncUI();
}

function endGame(w) {
  over = true;
  winner = w;
  syncUI();
  onOver();
}

// 풍선(동그라미)이 대상 캐릭터 몸(네모)에 닿는지
function balloonsHit(c, o) {
  const p = c.bal, r = c.type.balloon.r;
  const nx = Math.max(o.x, Math.min(p.x, o.x + o.w));
  const ny = Math.max(o.y, Math.min(p.y, o.y + o.h));
  return (p.x - nx) ** 2 + (p.y - ny) ** 2 <= r * r;
}

// 풍선 물리: 위로 떠오르려 하지만 줄(이미지 중앙)에 묶여 끌려다님
function moveBalloon(c, dt) {
  const bt = c.type.balloon, S = CONFIG.arenaSize, p = c.bal;
  const ax = c.x + c.w / 2, ay = c.y + c.h / 2;
  const vx = (p.x - p.px) * 0.998, vy = (p.y - p.py) * 0.998;
  p.px = p.x; p.py = p.y;
  p.x += vx;
  p.y += vy - bt.buoyancy * dt * dt;
  // 경기장 밖으로 못 나가게
  p.x = Math.max(bt.r, Math.min(S - bt.r, p.x));
  p.y = Math.max(bt.r, Math.min(S - bt.r, p.y));
  // 줄 길이 제한
  const dx = p.x - ax, dy = p.y - ay, d = Math.hypot(dx, dy);
  if (d > bt.rope) { p.x = ax + dx / d * bt.rope; p.y = ay + dy / d * bt.rope; }
}

// c가 공격할 수 있는 모든 대상: 자신을 뺀 캐릭터 + 다른 캐릭터의 소환수(대변해파리)
function foesOf(c) {
  const list = chars.filter(o => o !== c && o.alive);
  for (const m of minions) if (m.alive && m.owner !== c) list.push(m);
  return list;
}

function nearestFoeChar(owner, x, y) {
  let best = null, bd = Infinity;
  for (const o of chars) {
    if (o === owner || !o.alive) continue;
    const d = Math.hypot(o.x + o.w / 2 - x, o.y + o.h / 2 - y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

function hurt(target, amount, kind, crit) {
  if (!target.alive) return;
  target.hp = Math.max(0, target.hp - amount);
  floaters.push({
    x: target.x + target.w / 2 + (Math.random() - 0.5) * 120,
    y: target.y + target.h * 0.3,
    text: crit ? amount + "!" : String(amount),
    kind, crit: !!crit, t: 0,
  });
  if (target.hp <= 0) target.alive = false;
}

// 왕관점프 착지 파동
function wave(c) {
  const t = c.type;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  effects.push({ kind: "wave", x: cx, y: cy, r: t.waveRadius, t: 0, dur: 0.5 });
  for (const o of foesOf(c)) {
    const d = Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy);
    if (d <= t.waveRadius) hurt(o, t.waveDamage, "wave", false);
  }
}

// 키보드 내리치기: 사거리 무한. 한 번에 키보드 한 개가 아무 적 한 명에게 떨어진다
function slam(a) {
  const t = a.type;
  const chars_ = chars.filter(o => o !== a && o.alive);
  const pool = chars_.length ? chars_ : foesOf(a);     // 적 캐릭터가 우선, 없으면 소환수
  if (!pool.length) return;
  shake = 0.3;
  const o = pool[Math.floor(Math.random() * pool.length)];
  effects.push({ kind: "kb", x: o.x + o.w / 2, y: o.y, t: 0, dur: 0.4 });
  hurt(o, t.rageDamage, "rage", false);
}

// 얼림: 얼어있는 동안 움직이지도, 공격하지도 못하고 동상 대미지를 받는다
function freeze(caster, target) {
  const t = caster.type;
  target.frozen = true;
  if (target.rage) { target.rage = null; target.rageCd = 0; }   // 화내기가 끊기면 풀리는 즉시 다시 쓸 수 있음
  target.frozenT = 0;
  target.frostTicks = 0;
  target.freezeDur = t.freezeTime;
  target.frostDmg = t.frostDamage;
  target.frostInt = t.frostInterval;
  effects.push({
    kind: "ice", t: 0, dur: 0.5,
    x1: caster.x + caster.w / 2, y1: caster.y + caster.h / 2,
    x2: target.x + target.w / 2, y2: target.y + target.h / 2,
  });
}

function updateFrozen(c, dt) {
  c.frozenT += dt;
  const maxTicks = Math.floor(c.freezeDur / c.frostInt + 1e-9);
  while (c.frostTicks < maxTicks && c.frozenT >= (c.frostTicks + 1) * c.frostInt - 1e-9) {
    c.frostTicks++;
    hurt(c, c.frostDmg, "frost", false);
  }
  if (c.frozenT >= c.freezeDur - 1e-9) c.frozen = false;
}

// 얼음밤의 검이 상대 몸에 닿는지 (검 날을 따라 점을 찍어서 확인)
function swordTouches(c, o) {
  const t = c.type, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const ca = Math.cos(c.swordAng), sa = Math.sin(c.swordAng), hw = t.swordHalfW;
  for (let r = t.swordInner; r <= t.swordTip; r += 15) {
    const px = cx + ca * r, py = cy + sa * r;
    if (px >= o.x - hw && px <= o.x + o.w + hw && py >= o.y - hw && py <= o.y + o.h + hw) return true;
  }
  return false;
}

// ----- 으아라아 행동 -----
function euaraaAct(c, prevVy, dt) {
  const t = c.type;
  moveBalloon(c, dt);

  // 풍선 더블점프: 점프 정점에서 확률적으로 성공
  if (prevVy < 0 && c.vy >= 0 && !c.jumpChecked) {
    c.jumpChecked = true;
    if (Math.random() < CONFIG.doubleJumpChance) {
      c.vy = -DOUBLE_JUMP_SPEED;
      c.doubleJumped = true;
      c.djText = 1.5;
    }
  }

  // 평타: 풍선으로 공격 (자신은 제외)
  for (const k in c.hitCd) c.hitCd[k] -= dt;
  for (const o of foesOf(c)) {
    if ((c.hitCd[o.id] || 0) > 0) continue;
    if (balloonsHit(c, o)) {
      const crit = Math.random() < t.critChance;
      hurt(o, crit ? t.hitDamage * t.critMult : t.hitDamage, "balloon", crit);
      c.hitCd[o.id] = t.hitInterval;
      c.flash = 0.3;
    }
  }

  // 능력: 10초마다 화내기
  c.rageCd -= dt;
  if (c.rageCd <= 0 && !c.rage) {
    c.rage = { t: 0, slams: 0 };
    c.rageCd = t.rageInterval;
  }
  if (c.rage) {
    c.rage.t += dt;
    const slamAt = 0.7 + c.rage.slams * 0.4;
    if (c.rage.slams < t.rageSlams && c.rage.t >= slamAt) {
      slam(c);
      c.rage.slams++;
    }
    if (c.rage.t >= 0.7 + t.rageSlams * 0.4 + 0.4) c.rage = null;
  }
}

// ----- 얼음밤 행동 -----
function iceAct(c, dt) {
  const t = c.type;

  // 평타: 검이 1초에 spinRps바퀴 돈다. 상대 몸에 닿을 때마다 대미지
  c.swordAng += t.spinRps * Math.PI * 2 * dt;
  for (const k in c.hitCd) c.hitCd[k] -= dt;
  for (const o of foesOf(c)) {
    if (swordTouches(c, o)) {
      if ((c.hitCd[o.id] || 0) <= 0) {
        hurt(o, t.hitDamage, "sword", false);
        c.hitCd[o.id] = 1 / t.spinRps;     // 계속 겹쳐 있으면 한 바퀴 돌 때마다 한 번씩
        c.flash = 0.15;
      }
    } else if ((c.hitCd[o.id] || 0) > t.touchGap) {
      c.hitCd[o.id] = t.touchGap;          // 떨어졌다 다시 닿으면 곧바로 적중 가능
    }
  }

  // 능력 얼음밤: 7초마다 아무 적을 얼린다 (아직 안 얼어있는 적을 우선)
  c.iceCd -= dt;
  if (c.iceCd <= 0) {
    const foes = chars.filter(o => o !== c && o.alive);
    if (foes.length) {
      const fresh = foes.filter(o => !o.frozen);
      const pool = fresh.length ? fresh : foes;
      freeze(c, pool[Math.floor(Math.random() * pool.length)]);
      c.msg = { text: "얼음밤!", t: 1.2 };
      c.iceCd = t.iceInterval;
    } else {
      c.iceCd = 0;
    }
  }
}

// ----- 호원 행동 -----
function spawnJelly(c) {
  const t = c.type, S = CONFIG.arenaSize;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const x = Math.max(0, Math.min(S - t.jellyW, cx - t.jellyW / 2 + (Math.random() - 0.5) * 300));
  const y = Math.max(0, Math.min(S - t.jellyH, cy - t.jellyH / 2 - 120 + (Math.random() - 0.5) * 200));
  const a = Math.random() * Math.PI * 2;
  minions.push({
    id: "m" + nextMid++, kind: "jelly", owner: c, type: t, name: "대변해파리",
    x, y, w: t.jellyW, h: t.jellyH,
    vx: Math.cos(a) * t.jellySpeed, vy: Math.sin(a) * t.jellySpeed,
    hp: t.jellyHp, maxHp: t.jellyHp, alive: true,
    spitCd: t.spitInterval,
  });
  effects.push({ kind: "puff", x: x + t.jellyW / 2, y: y + t.jellyH / 2, t: 0, dur: 0.5 });
}

function throwBun(c, target) {
  const t = c.type;
  shots.push({
    kind: "bun", owner: c, target, alive: true,
    x: c.x + c.w / 2, y: c.y + c.h * 0.2,
    ang: -Math.PI / 2 + (Math.random() - 0.5) * 1.4,   // 위로 던져 올린 뒤 유도됨
    speed: t.bunSpeed, turn: t.bunTurn, life: t.bunLife, r: 34, spin: 0,
  });
}

function howonAct(c, dt) {
  const t = c.type;

  // 능력1: 대변해파리 호빵족
  c.jellyCd -= dt;
  if (c.jellyCd <= 0) {
    spawnJelly(c);
    c.msg = { text: "대변해파리 호빵족!", t: 1.2, color: "#9a5a00" };
    c.jellyCd = t.jellyInterval;
  }

  // 능력2: 호빵 (유도탄). 가장 가까운 적을 쫓아간다
  c.bunCd -= dt;
  if (c.bunCd <= 0) {
    const tg = nearestFoeChar(c, c.x + c.w / 2, c.y + c.h / 2);
    if (tg) {
      throwBun(c, tg);
      c.msg = { text: "호빵!", t: 1.0, color: "#d97a00" };
      c.bunCd = t.bunInterval;
    } else {
      c.bunCd = 0;
    }
  }
}

// 소환수: 대변해파리는 둥둥 떠다니며 1초마다 가장 가까운 적에게 똥물을 뱉는다
function stepMinions(dt) {
  const S = CONFIG.arenaSize;
  for (const m of minions) {
    if (!m.alive) continue;
    const t = m.type;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < 0)           { m.x = 0;           m.vx =  Math.abs(m.vx); }
    if (m.x + m.w > S)     { m.x = S - m.w;     m.vx = -Math.abs(m.vx); }
    if (m.y < 0)           { m.y = 0;           m.vy =  Math.abs(m.vy); }
    if (m.y + m.h > S)     { m.y = S - m.h;     m.vy = -Math.abs(m.vy); }

    m.spitCd -= dt;
    if (m.spitCd <= 0) {
      const mx = m.x + m.w / 2, my = m.y + m.h * 0.45;
      const tg = nearestFoeChar(m.owner, mx, my);
      if (tg) {
        shots.push({
          kind: "spit", owner: m.owner, target: tg, alive: true,
          x: mx, y: my, ang: Math.atan2(tg.y + tg.h / 2 - my, tg.x + tg.w / 2 - mx),
          speed: t.spitSpeed, turn: 30, life: 3, r: 14, spin: 0,
        });
        m.spitCd = t.spitInterval;
      } else {
        m.spitCd = 0;
      }
    }
  }
}

// 투사체(호빵 / 똥물): 목표를 향해 방향을 꺾으며 날아가고, 닿으면 대미지
function stepShots(dt) {
  for (const p of shots) {
    if (!p.alive) continue;
    if (!p.target || !p.target.alive) {                 // 목표가 쓰러지면 가장 가까운 적으로 갈아탐
      p.target = nearestFoeChar(p.owner, p.x, p.y);
      if (!p.target) { p.alive = false; continue; }
    }
    const tg = p.target;
    const want = Math.atan2(tg.y + tg.h / 2 - p.y, tg.x + tg.w / 2 - p.x);
    let d = want - p.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const maxTurn = p.turn * dt;
    p.ang += Math.max(-maxTurn, Math.min(maxTurn, d));
    p.x += Math.cos(p.ang) * p.speed * dt;
    p.y += Math.sin(p.ang) * p.speed * dt;
    p.spin += dt * 8;
    p.life -= dt;

    const nx = Math.max(tg.x, Math.min(p.x, tg.x + tg.w));
    const ny = Math.max(tg.y, Math.min(p.y, tg.y + tg.h));
    if ((p.x - nx) ** 2 + (p.y - ny) ** 2 <= p.r * p.r) {
      const t = p.owner.type;
      if (p.kind === "bun") {
        const crit = Math.random() < t.bunCritChance;
        hurt(tg, crit ? Math.round(t.bunDamage * t.bunCritMult) : t.bunDamage, "bun", crit);
        effects.push({ kind: "puff", x: p.x, y: p.y, t: 0, dur: 0.5 });
        shake = Math.max(shake, 0.15);
      } else {
        hurt(tg, t.spitDamage, "spit", false);
      }
      p.alive = false;
    } else if (p.life <= 0) {
      p.alive = false;
    }
  }
  shots = shots.filter(p => p.alive);
}

function step(dt) {
  const S = CONFIG.arenaSize;
  time += dt;

  for (const c of chars) {
    if (!c.alive) continue;

    // 얼어있으면 제자리에 멈춤 (동상 대미지만 받음)
    if (c.frozen) {
      if (c.type.rageInterval) c.rageCd = Math.max(0, c.rageCd - dt);   // 쿨타임은 계속 흐름
      if (c.type.id === "howon") { c.jellyCd = Math.max(0, c.jellyCd - dt); c.bunCd = Math.max(0, c.bunCd - dt); }
      updateFrozen(c, dt);
      continue;
    }

    // --- 이동 / 중력 ---
    const prevVy = c.vy;
    c.vy += CONFIG.gravity * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    if (c.x < 0)         { c.x = 0;         c.vx =  Math.abs(c.vx); }
    if (c.x + c.w > S)   { c.x = S - c.w;   c.vx = -Math.abs(c.vx); }
    if (c.y < 0)         { c.y = 0;         c.vy =  Math.abs(c.vy); }
    if (c.y + c.h > S) {                    // 바닥: 항상 같은 높이로 튕김
      c.y = S - c.h;
      c.vy = -BOUNCE_SPEED;
      c.jumpChecked = false;
      if (c.doubleJumped) { c.doubleJumped = false; wave(c); }
    }

    if (c.type.id === "euaraa") euaraaAct(c, prevVy, dt);
    else if (c.type.id === "ice") iceAct(c, dt);
    else if (c.type.id === "howon") howonAct(c, dt);
  }

  stepMinions(dt);
  stepShots(dt);

  // 패시브 서든데스: 상대 체력이 기준 이하가 되면 체력 0으로 만들고 얼음밤이 승리
  for (const c of chars) {
    if (over) break;
    if (!c.alive || c.type.id !== "ice") continue;
    for (const o of chars) {
      if (o === c || !o.alive || o.hp > c.type.suddenHp) continue;
      o.hp = 0;
      o.alive = false;
      floaters.push({ x: o.x + o.w / 2, y: o.y + o.h * 0.3, text: "서든데스!", kind: "sudden", crit: false, t: 0 });
      c.msg = { text: "서든데스 발동!", t: 3 };
      sudden = { by: c.name, victim: o.name };
      shake = 0.4;
      endGame(c);
      break;
    }
  }

  // 쓰러진 캐릭터 제거 + 승패 판정
  chars = chars.filter(c => c.alive);
  minions = minions.filter(m => m.alive && m.owner.alive);   // 주인이 쓰러지면 소환수도 사라짐
  if (peak >= 2 && chars.length <= 1 && !over) endGame(chars[0] || null);
}

// 이펙트 / 숫자 / 말풍선 타이머 (실제 시간 기준)
function updateFx(dt) {
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.t < e.dur);
  for (const f of floaters) { f.t += dt; f.y -= 120 * dt; }
  floaters = floaters.filter(f => f.t < 1.0);
  for (const c of chars) {
    if (c.djText > 0) c.djText -= dt;
    if (c.flash > 0) c.flash -= dt;
    if (c.msg) { c.msg.t -= dt; if (c.msg.t <= 0) c.msg = null; }
  }
  if (shake > 0) shake -= dt;
}

// ===== 그리기 =====
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
function label(text, x, y, size, fill, stroke) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = "center";
  ctx.lineJoin = "round";
  ctx.lineWidth = size / 6;
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function drawKeyboard(x, bottom) {
  const w = 380, h = 120, left = x - w / 2, top = bottom - h;
  ctx.fillStyle = "#333";
  ctx.fillRect(left, top, w, h);
  ctx.fillStyle = "#ddd";
  const cols = 12, rows = 4, pad = 10;
  const kw = (w - pad * (cols + 1)) / cols, kh = (h - pad * (rows + 1)) / rows;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      ctx.fillRect(left + pad + c * (kw + pad), top + pad + r * (kh + pad), kw, kh);
}

// 파란 검 (2D 도형으로 그림). 몸 중심에서 swordAng 방향으로 뻗어 있음
function drawSword(c) {
  const t = c.type, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const hit = c.flash > 0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(c.swordAng);
  ctx.lineJoin = "round";

  // 손잡이 끝(폼멜)
  ctx.beginPath();
  ctx.arc(52, 0, 13, 0, Math.PI * 2);
  ctx.fillStyle = "#16307f";
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#0a1a4d"; ctx.stroke();

  // 손잡이
  ctx.fillStyle = "#1b2f8f";
  ctx.fillRect(60, -9, 42, 18);
  ctx.strokeStyle = "#0a1a4d";
  ctx.strokeRect(60, -9, 42, 18);
  ctx.beginPath();                                   // 손잡이 감은 줄무늬
  for (let x = 68; x < 100; x += 9) { ctx.moveTo(x, -9); ctx.lineTo(x + 5, 9); }
  ctx.strokeStyle = "#5b86ff"; ctx.lineWidth = 2; ctx.stroke();

  // 가드(날밑)
  ctx.fillStyle = "#2f66e8";
  ctx.fillRect(100, -34, 14, 68);
  ctx.lineWidth = 3; ctx.strokeStyle = "#0a1a4d";
  ctx.strokeRect(100, -34, 14, 68);

  // 날
  const inner = t.swordInner, tip = t.swordTip, hw = t.swordHalfW;
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, "#9cc4ff");
  g.addColorStop(0.5, "#4a86f5");
  g.addColorStop(1, "#1a4ed0");
  ctx.beginPath();
  ctx.moveTo(inner, -hw);
  ctx.lineTo(tip - 38, -hw);
  ctx.lineTo(tip, 0);
  ctx.lineTo(tip - 38, hw);
  ctx.lineTo(inner, hw);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = hit ? 8 : 4;
  ctx.strokeStyle = hit ? "#e11" : "#0d2a8a";
  ctx.stroke();

  // 날 가운데 홈(반짝이는 선)
  ctx.beginPath();
  ctx.moveTo(inner + 10, 0);
  ctx.lineTo(tip - 30, 0);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(220,235,255,0.9)";
  ctx.stroke();
  ctx.restore();
}

// 대변해파리 (2D 도형): 똥 모양 위에 얼굴이 있는 해파리
function drawJelly(m) {
  const now = performance.now() / 1000;
  const cx = m.x + m.w / 2, bob = Math.sin(now * 3 + m.x * 0.01) * 6;
  const top = m.y + bob, w = m.w, h = m.h;
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  // 촉수 (살랑살랑)
  ctx.strokeStyle = "#8a5a22";
  ctx.lineWidth = 9;
  for (let i = 0; i < 5; i++) {
    const bx = cx - w * 0.36 + i * (w * 0.18);
    ctx.beginPath();
    ctx.moveTo(bx, top + h * 0.58);
    for (let k = 1; k <= 6; k++) {
      const yy = top + h * 0.58 + k * (h * 0.42 / 6);
      ctx.lineTo(bx + Math.sin(now * 5 + i * 1.3 + k * 0.9) * 8, yy);
    }
    ctx.stroke();
  }

  // 몸통(반투명 돔)
  ctx.beginPath();
  ctx.ellipse(cx, top + h * 0.58, w * 0.5, h * 0.42, 0, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = "rgba(150,98,40,0.88)";
  ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "#4a2c0f"; ctx.stroke();

  // 똥 소용돌이 (위로 갈수록 작은 3단 + 뾰족한 끝)
  ctx.fillStyle = "#7a4a18";
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.17, w * 0.30, h * 0.075, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.075, w * 0.21, h * 0.065, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w * 0.11, top + h * 0.05); ctx.lineTo(cx + w * 0.02, top - h * 0.07); ctx.lineTo(cx + w * 0.11, top + h * 0.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 얼굴
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(cx - w * 0.18, top + h * 0.40, 11, 0, Math.PI * 2); ctx.arc(cx + w * 0.18, top + h * 0.40, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(cx - w * 0.16, top + h * 0.41, 5, 0, Math.PI * 2); ctx.arc(cx + w * 0.20, top + h * 0.41, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.53, 13, 10, 0, 0, Math.PI * 2); ctx.fillStyle = "#3a1d08"; ctx.fill();   // 똥물을 뱉는 입

  // 체력바
  const by = m.y - 28;
  ctx.fillStyle = "#fff"; ctx.fillRect(m.x, by, w, 16);
  ctx.fillStyle = "#2ecc71"; ctx.fillRect(m.x, by, w * (m.hp / m.maxHp), 16);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeRect(m.x, by, w, 16);
  label(Math.ceil(m.hp) + "/" + m.maxHp, cx, by - 6, 24, "#000", "#fff");
}

// 호빵 / 똥물 투사체
function drawShot(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.kind === "spit") {
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#6b4a12"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#2f1f06"; ctx.stroke();
    ctx.beginPath(); ctx.arc(-4, -4, 4, 0, Math.PI * 2); ctx.fillStyle = "#b08a3a"; ctx.fill();
  } else {
    // 김이 모락모락 (날아온 반대 방향으로 꼬리)
    ctx.strokeStyle = "rgba(160,160,160,0.7)"; ctx.lineWidth = 6; ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-Math.cos(p.ang) * 40 - Math.sin(p.ang) * i * 16, -Math.sin(p.ang) * 40 + Math.cos(p.ang) * i * 16);
      ctx.lineTo(-Math.cos(p.ang) * 90 - Math.sin(p.ang) * i * 22, -Math.sin(p.ang) * 90 + Math.cos(p.ang) * i * 22);
      ctx.stroke();
    }
    ctx.rotate(p.spin);
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff4d8"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#c9a46a"; ctx.stroke();
    ctx.beginPath();                                   // 윗면 주름
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.quadraticCurveTo(Math.cos(a + 0.4) * 16, Math.sin(a + 0.4) * 16, Math.cos(a) * 26, Math.sin(a) * 24);
    }
    ctx.lineWidth = 3; ctx.strokeStyle = "#d9bf8c"; ctx.stroke();
  }
  ctx.restore();
}

// 얼음 이펙트: 얼음밤에서 대상까지 번쩍이는 줄기
function drawIceBolt(e) {
  const p = e.t / e.dur;
  const dx = e.x2 - e.x1, dy = e.y2 - e.y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len, seg = Math.max(4, Math.floor(len / 50));
  ctx.beginPath();
  ctx.moveTo(e.x1, e.y1);
  for (let i = 1; i < seg; i++) {
    const k = i / seg, j = (i % 2 ? 1 : -1) * 30;
    ctx.lineTo(e.x1 + dx * k + nx * j, e.y1 + dy * k + ny * j);
  }
  ctx.lineTo(e.x2, e.y2);
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(90,200,255," + (1 - p) + ")";
  ctx.lineWidth = 22;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255," + (1 - p) + ")";
  ctx.lineWidth = 8;
  ctx.stroke();
}

// 얼음 덩어리 (얼어있는 캐릭터 위에 덮음)
function drawIceBlock(c) {
  const x = c.x - 8, y = c.y - 8, w = c.w + 16, h = c.h + 16;
  ctx.fillStyle = "rgba(150,225,255,0.55)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#2ab0f0";
  ctx.lineWidth = 8;
  ctx.strokeRect(x, y, w, h);
  ctx.beginPath();                                   // 얼음 반사광
  ctx.moveTo(x + w * 0.12, y + h * 0.35); ctx.lineTo(x + w * 0.45, y + 12);
  ctx.moveTo(x + w * 0.12, y + h * 0.55); ctx.lineTo(x + w * 0.7, y + 12);
  ctx.moveTo(x + w * 0.5, y + h - 12);    ctx.lineTo(x + w - 12, y + h * 0.5);
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 6;
  ctx.stroke();
  label("❄ 동상", c.x + c.w / 2, c.y + c.h / 2, 60, "#fff", "#2ab0f0");
}

function draw() {
  const S = CONFIG.arenaSize;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, S, S);
  if (shake > 0) {
    const m = 40 * (shake / 0.3);
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  // 파동
  for (const e of effects) {
    if (e.kind !== "wave") continue;
    const p = e.t / e.dur;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * p, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,0,0," + (1 - p) + ")";
    ctx.lineWidth = 14;
    ctx.stroke();
  }

  // 캐릭터
  for (const c of chars) {
    const t = c.type;
    if (t.id === "ice") drawSword(c);                 // 검은 등뒤에 있으니 몸 아래에 그림
    if (t.ready) ctx.drawImage(t.img, c.x, c.y, c.w, c.h);

    if (t.id === "euaraa") {
      // 줄(이미지 중앙) + 풍선(도형)
      const bt = t.balloon, p = c.bal;
      const ax = c.x + c.w / 2, ay = c.y + c.h / 2;
      const ang = Math.atan2(ay - p.y, ax - p.x);
      const tx = p.x + Math.cos(ang) * bt.r, ty = p.y + Math.sin(ang) * bt.r;   // 풍선에서 줄이 나오는 점
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(tx, ty);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#222";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ax, ay, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#222";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, bt.r, 0, Math.PI * 2);
      ctx.fillStyle = bt.color;
      ctx.fill();
      ctx.lineWidth = c.flash > 0 ? 10 : 4;           // 적중하면 빨간 굵은 테두리
      ctx.strokeStyle = c.flash > 0 ? "#e11" : "#222";
      ctx.stroke();
      ctx.beginPath();                                // 반짝이는 하이라이트
      ctx.ellipse(p.x - bt.r * 0.35, p.y - bt.r * 0.4, bt.r * 0.2, bt.r * 0.12, -0.6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fill();
    }

    if (c.frozen) drawIceBlock(c);

    const barH = 24;
    const by = Math.max(c.y - 40, 70);
    ctx.fillStyle = "#fff";
    ctx.fillRect(c.x, by, c.w, barH);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(c.x, by, c.w * (c.hp / t.hp), barH);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 4;
    ctx.strokeRect(c.x, by, c.w, barH);
    label(c.name + "  " + Math.ceil(c.hp) + "/" + t.hp, c.x + c.w / 2, by - 12, 34, "#000", "#fff");

    if (c.djText > 0) label("풍선달린 왕관점프!", c.x + c.w / 2, by - 70, 52, "#d98c00", "#000");
    if (c.msg) label(c.msg.text, c.x + c.w / 2, by - 70, 56, c.msg.color || "#1f4fd6", "#fff");
    if (c.rage && c.rage.t < 2.0) label(t.rageShout, c.x + c.w / 2, by - 135, 56, "#e11", "#000");
  }

  // 소환수 / 투사체
  for (const m of minions) drawJelly(m);
  for (const p of shots) drawShot(p);
  for (const e of effects) {
    if (e.kind !== "puff") continue;
    const p = e.t / e.dur;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 20 + 70 * p, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(200,140,40," + (1 - p) + ")";
    ctx.lineWidth = 12;
    ctx.stroke();
  }

  // 얼음 줄기
  for (const e of effects) if (e.kind === "ice") drawIceBolt(e);

  // 키보드
  for (const e of effects) {
    if (e.kind !== "kb") continue;
    const p = e.t / e.dur;
    let bottom, alpha = 1;
    if (p < 0.5) bottom = e.y - 600 + (p / 0.5) * 620;
    else { bottom = e.y + 20; alpha = 1 - (p - 0.5) / 0.5; }
    ctx.globalAlpha = alpha;
    drawKeyboard(e.x, bottom);
    ctx.globalAlpha = 1;
  }

  // 대미지 숫자
  for (const f of floaters) {
    const color = f.crit ? "#e11" : f.kind === "wave" ? "#1a6dd6" : f.kind === "rage" ? "#8a2be2"
                : f.kind === "frost" ? "#0aa5d8" : f.kind === "sword" ? "#1f4fd6" : f.kind === "sudden" ? "#e11" : f.kind === "bun" ? "#d97a00" : f.kind === "spit" ? "#6b4a12" : "#000";
    ctx.globalAlpha = 1 - f.t;
    label(f.text, f.x, f.y, f.crit ? 76 : f.kind === "sudden" ? 90 : f.kind === "spit" ? 34 : 54, color, "#fff");
    ctx.globalAlpha = 1;
  }

  // 서든데스 / 승리 표시
  if (sudden) {
    label("⚡ 서든데스 발동!", S / 2, S / 2 - 440, 110, "#1f4fd6", "#fff");
    label(sudden.victim + "의 체력이 " + TYPES.ice.suddenHp + " 이하 → 0!", S / 2, S / 2 - 340, 60, "#000", "#fff");
  }
  if (over) {
    label(winner ? winner.name + " 승리!" : "무승부!", S / 2, S / 2, 220, "#000", "#fff");
  }
}

function fmt(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
}

// ===== 경기 영상 녹화 / 다시보기 / 다운로드 =====
let rec = null, recChunks = [], recExt = "mp4", recUrl = null, recTimer = null;

// MP4를 우선 사용하고, 지원하지 않는 브라우저(예: 파이어폭스)는 WEBM으로 대체
function pickMime() {
  if (typeof MediaRecorder === "undefined") return "";
  const list = ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1", "video/mp4",
                "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return list.find(m => MediaRecorder.isTypeSupported(m)) || "";
}

function setStatus(text, recording) {
  recStatus.textContent = text;
  recStatus.className = recording ? "recording" : "";
}

function startRecording() {
  const mime = pickMime();
  if (!mime || !canvas.captureStream) { setStatus("이 브라우저는 영상 녹화를 지원하지 않아요", false); return; }
  recChunks = [];
  recExt = mime.startsWith("video/mp4") ? "mp4" : "webm";
  try {
    rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6000000 });
  } catch (e) { rec = null; setStatus("영상 녹화를 시작하지 못했어요", false); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.start(1000);
  setStatus("● 녹화 중", true);
}

function stopRecording(discard) {
  clearTimeout(recTimer);
  const r = rec;
  if (!r) return;
  rec = null;
  r.onstop = () => {
    if (discard) return;
    const blob = new Blob(recChunks, { type: r.mimeType.split(";")[0] });
    recUrl = URL.createObjectURL(blob);
    downloadBtn.textContent = "⬇ 다운로드 (" + recExt.toUpperCase() + ")";
    replayBtn.disabled = downloadBtn.disabled = false;
    setStatus("경기 영상이 준비됐어요", false);
  };
  if (r.state !== "inactive") r.stop();
}

// 전투가 끝난 뒤 승리 화면까지 잠깐 더 녹화하고 마무리
function onOver() {
  if (!rec) return;
  setStatus("영상 저장 중...", true);
  recTimer = setTimeout(() => stopRecording(false), 2500);
}

function clearReplay() {
  if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = null; }
  replayBtn.disabled = downloadBtn.disabled = true;
  downloadBtn.textContent = "⬇ 다운로드";
  overlay.hidden = true;
  setStatus("전투 후 영상 저장", false);
}

replayBtn.addEventListener("click", () => {
  if (!recUrl) return;
  replayVideo.src = recUrl;
  overlay.hidden = false;
  replayVideo.play();
});
closeOverlay.addEventListener("click", () => {
  replayVideo.pause();
  overlay.hidden = true;
});
downloadBtn.addEventListener("click", () => {
  if (!recUrl) return;
  const a = document.createElement("a");
  a.href = recUrl;
  a.download = "공싸움-" + Date.now() + "." + recExt;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// ===== 버튼 =====
startBtn.addEventListener("click", () => {
  if (running) reset();
  else { running = true; syncUI(); startRecording(); }
});
// ===== 캐릭터 선택 창: 추가 버튼을 누르면 캐릭터 목록이 뜨고, 하나를 고르면 소환 =====
let pickSide = "left";
function openPicker(side) {
  if (over || chars.length >= CONFIG.maxCharacters) return;
  pickSide = side;
  pickerList.innerHTML = "";
  for (const k in TYPES) {
    const t = TYPES[k];
    const b = document.createElement("button");
    b.className = "pick";
    const im = document.createElement("img");
    im.src = t.src; im.alt = t.name;
    const nm = document.createElement("span"); nm.className = "pname"; nm.textContent = t.name;
    const info = document.createElement("span"); info.className = "pinfo"; info.textContent = "체력 " + t.hp;
    const ds = document.createElement("span"); ds.className = "pdesc"; ds.textContent = t.desc || "";
    b.append(im, nm, info, ds);
    b.addEventListener("click", () => { spawn(k, pickSide); closePicker(); });
    pickerList.appendChild(b);
  }
  picker.hidden = false;
}
function closePicker() { picker.hidden = true; }
addLeft.addEventListener("click", () => openPicker("left"));
addRight.addEventListener("click", () => openPicker("right"));
pickerCancel.addEventListener("click", closePicker);
picker.addEventListener("click", e => { if (e.target === picker) closePicker(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });
syncUI();

// ===== 메인 루프 (고정 시간 간격으로 물리 계산) =====
const FIXED_DT = 1 / 240;
let last = performance.now(), acc = 0;
function loop(now) {
  const rdt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (running && !over) {
    acc += rdt;
    while (acc >= FIXED_DT) {
      step(FIXED_DT);
      acc -= FIXED_DT;
      if (over) break;
    }
  }
  updateFx(rdt);
  draw();
  timerEl.textContent = fmt(time);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
