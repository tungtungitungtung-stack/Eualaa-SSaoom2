<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공싸움</title>
<style>
  :root { --side: min(96vw, calc(100vh - 200px)); }
  @supports (height: 100dvh) { :root { --side: min(96vw, calc(100dvh - 200px)); } }
  html, body { margin: 0; background: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { min-height: 100vh; padding: 8px 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .bar { width: var(--side); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
  .top { position: sticky; top: 0; z-index: 5; background: #fff; padding: 2px 0; }
  .grp { display: flex; flex-wrap: wrap; gap: 6px; }
  canvas { background: #fff; border: 4px solid #000; box-sizing: border-box; width: var(--side); height: auto; aspect-ratio: 1 / 1; }
  button { font-size: 16px; font-weight: bold; padding: 8px 14px; border: 2px solid #000; border-radius: 8px; background: #fff; color: #000; cursor: pointer; }
  button:hover:not(:disabled) { background: #000; color: #fff; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #recStatus { font-size: 14px; font-weight: bold; color: #000; }
  #recStatus.recording { color: #e11; }
  #overlay { position: fixed; inset: 0; background: rgba(255,255,255,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  #overlay[hidden] { display: none; }
  #picker { position: fixed; inset: 0; background: rgba(255,255,255,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 20; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  #picker[hidden] { display: none; }
  #pickerTitle { font-size: 24px; font-weight: bold; }
  #pickerList { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .pick { min-width: 150px; padding: 16px 24px; font-size: 22px; }
  #replayVideo { max-width: 96vw; max-height: calc(100vh - 100px); border: 4px solid #000; background: #fff; }
  #timer { font-size: 28px; font-weight: bold; font-variant-numeric: tabular-nums; color: #000; }
</style>
</head>
<body>
<div class="bar top">
  <button id="startBtn">시작</button>
  <span id="timer">00:00.0</span>
</div>
<canvas id="arena" width="1600" height="1600"></canvas>
<div class="bar">
  <span id="recStatus">전투 후 영상 저장</span>
  <span class="grp">
    <button id="replayBtn" disabled>▶ 다시보기</button>
    <button id="downloadBtn" disabled>⬇ 다운로드</button>
  </span>
</div>
<div class="bar">
  <button id="addLeft">◀ 캐릭터 추가</button>
  <button id="addRight">캐릭터 추가 ▶</button>
</div>

<div id="picker" hidden>
  <div id="pickerTitle">추가할 캐릭터를 선택하세요</div>
  <div id="pickerList"></div>
  <button id="pickerCancel">취소</button>
</div>

<div id="overlay" hidden>
  <button id="closeOverlay">✕ 닫기</button>
  <video id="replayVideo" controls playsinline></video>
</div>

function spawn(typeKey, side) {
  if (over || chars.length >= CONFIG.maxCharacters) return;
  const t = TYPES[typeKey], S = CONFIG.arenaSize;
  const id = nextId++;
  let pos, tries = 0;
  do {
    pos = { x: Math.random() * (S - t.w), y: Math.random() * (S - t.h) };
    tries++;
  } while (tries < 60 && chars.some(o => o.alive && pos.x < o.x + o.w && pos.x + t.w > o.x && pos.y < o.y + o.h && pos.y + t.h > o.y));
  const c = {
    id, type: t, name: t.name + " " + id,
    x: pos.x, y: pos.y,                // 경기장 안 어디든 랜덤 (다른 캐릭터와 겹치지 않게)
    vx: (Math.random() < 0.5 ? -1 : 1) * CONFIG.startSpeedX * (0.4 + Math.random() * 1.2),   // 방향·속도 랜덤
    vy: (Math.random() - 0.5) * 1000,                                                         // 처음 위/아래 속도도 랜덤
    w: t.w, h: t.h,
    hp: t.hp, alive: true,
    hitCd: {},            // 상대별 평타 쿨타임
    flash: 0,             // 평타가 적중했을 때 깜빡임
    msg: null,            // 머리 위에 잠깐 띄우는 말 {text, t}
    // 동상(얼음) 상태
    frozen: false, frozenT: 0, frostTicks: 0, freezeDur: 0, frostDmg: 0, frostInt: 1,
    // 으아라아 전용
    jumpChecked: false,   // 이번 점프에서 더블점프 판정을 했는지
    doubleJumped: false,  // 더블점프에 성공해서 공중에 있는지
    rageCd: t.rageInterval || 0,
    rage: null,
    djText: 0,
    // 얼음밤 전용
    swordAng: Math.random() * Math.PI * 2,
    iceCd: t.iceInterval || 0,
    // 돌진 (얼음밤 / 조디악)
    dashCd: t.dashInterval || 0, dash: null,
    // 호원 전용
    jellyCd: t.jellyInterval || 0,
    bunCd: t.bunInterval || 0,
    // 노션 전용
    coinCd: t.coinInterval || 0,
    erCd: t.erInterval || 0,
    // 로블감수성 전용
    floorCd: t.floorInterval || 0,
    slowT: 0,             // 인간의 한계(속도 감소) 남은 시간
    // 현자미 전용
    peelCd: t.peelInterval || 0,
    // H2K 전용
    sport: "base", sportCd: t.sportInterval || 0, xAlive: false, xCd: 0.3,
    // 파코엘 전용
    pidx: 0, pwait: t.restTime || 0, pj: null, hitAt: {}, stompAt: {},
    // 공통
    stunT: 0,             // 멈춤(기절) 남은 시간
    contactAt: {},        // 몸 접촉 대미지를 마지막으로 준 시각 (상대별)
  };
  if (t.balloon) {
    const bx = c.x + c.w / 2, by = Math.max(t.balloon.r, c.y + c.h / 2 - t.balloon.rope);
    c.bal = { x: bx, y: by, px: bx, py: by };     // 풍선 위치 / 이전 위치 (베를레 적분)
  }
  if (t.id === "paco") makePillars(c);
  chars.push(c);
  peak = Math.max(peak, chars.length);
  syncUI();
}

// 풍선(동그라미)이 대상 캐릭터 몸(네모)에 닿는지
function balloonsHit(c, o) {
  const p = c.bal, r = c.type.balloon.r;
  const nx = Math.max(o.x, Math.min(p.x, o.x + o.w));
  const ny = Math.max(o.y, Math.min(p.y, o.y + o.h));
  return (p.x - nx) ** 2 + (p.y - ny) ** 2 <= r * r;
}

// 풍선 물리: 위로 떠오르려 하지만 줄(이미지 중앙)에 묶여 끌려다님
function moveBalloon(c, dt) {
  const bt = c.type.balloon, S = CONFIG.arenaSize, p = c.bal;
  const ax = c.x + c.w / 2, ay = c.y + c.h / 2;
  const vx = (p.x - p.px) * 0.998, vy = (p.y - p.py) * 0.998;
  p.px = p.x; p.py = p.y;
  p.x += vx;
  p.y += vy - bt.buoyancy * dt * dt;
  // 서서히 가장 가까운 적을 향해 움직임 (줄 길이 안에서)
  const tg = nearestFoeChar(c, p.x, p.y);
  if (tg) {
    const tx = tg.x + tg.w / 2 - p.x, ty = tg.y + tg.h / 2 - p.y, td = Math.hypot(tx, ty) || 1;
    p.x += tx / td * bt.seek * dt * dt;
    p.y += ty / td * bt.seek * dt * dt;
  }
  // 경기장 밖으로 못 나가게
  p.x = Math.max(bt.r, Math.min(S - bt.r, p.x));
  p.y = Math.max(bt.r, Math.min(S - bt.r, p.y));
  // 줄 길이 제한
  const dx = p.x - ax, dy = p.y - ay, d = Math.hypot(dx, dy);
  if (d > bt.rope) { p.x = ax + dx / d * bt.rope; p.y = ay + dy / d * bt.rope; }
}

// c가 공격할 수 있는 모든 대상: 자신을 뺀 캐릭터 + 다른 캐릭터의 소환수(대변해파리)
function foesOf(c) {
  const list = chars.filter(o => o !== c && o.alive);
  for (const m of minions) if (m.alive && m.owner !== c) list.push(m);
  return list;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function nearestFoeChar(owner, x, y) {
  let best = null, bd = Infinity;
  for (const o of chars) {
    if (o === owner || !o.alive) continue;
    const d = Math.hypot(o.x + o.w / 2 - x, o.y + o.h / 2 - y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

function hurt(target, amount, kind, crit) {
  if (!target.alive) return;
  // 패시브 양산형 파워: 받는 대미지 10% 감소, 소수점은 반올림
  if (target.type && target.type.dmgReducePct) amount = Math.round(amount * (100 - target.type.dmgReducePct) / 100);
  target.hp = Math.max(0, target.hp - amount);
  floaters.push({
    x: target.x + target.w / 2 + (Math.random() - 0.5) * 120,
    y: target.y + target.h * 0.3,
    text: crit ? amount + "!" : String(amount),
    kind, crit: !!crit, t: 0,
  });
  if (target.hp <= 0) target.alive = false;
}

// 왕관점프 착지 파동
function wave(c) {
  const t = c.type;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  effects.push({ kind: "wave", x: cx, y: cy, r: t.waveRadius, t: 0, dur: 0.5 });
  for (const o of foesOf(c)) {
    const d = Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy);
    if (d <= t.waveRadius) hurt(o, t.waveDamage, "wave", false);
  }
}

// 키보드 내리치기: 사거리 무한. 한 번에 키보드 한 개가 아무 적 한 명에게 떨어진다
function slam(a) {
  const t = a.type;
  const chars_ = chars.filter(o => o !== a && o.alive);
  const pool = chars_.length ? chars_ : foesOf(a);     // 적 캐릭터가 우선, 없으면 소환수
  if (!pool.length) return;
  shake = 0.3;
  const o = pool[Math.floor(Math.random() * pool.length)];
  effects.push({ kind: "kb", x: o.x + o.w / 2, y: o.y, t: 0, dur: 0.4 });
  hurt(o, t.rageDamage, "rage", false);
}

// 얼림: 얼어있는 동안 움직이지도, 공격하지도 못하고 동상 대미지를 받는다
function freeze(caster, target) {
  const t = caster.type;
  target.frozen = true;
  if (target.rage) { target.rage = null; target.rageCd = 0; }   // 화내기가 끊기면 풀리는 즉시 다시 쓸 수 있음
  target.frozenT = 0;
  target.frostTicks = 0;
  target.freezeDur = t.freezeTime;
  target.frostDmg = t.frostDamage;
  target.frostInt = t.frostInterval;
  effects.push({
    kind: "ice", t: 0, dur: 0.5,
    x1: caster.x + caster.w / 2, y1: caster.y + caster.h / 2,
    x2: target.x + target.w / 2, y2: target.y + target.h / 2,
  });
}

function updateFrozen(c, dt) {
  c.frozenT += dt;
  const maxTicks = Math.floor(c.freezeDur / c.frostInt + 1e-9);
  while (c.frostTicks < maxTicks && c.frozenT >= (c.frostTicks + 1) * c.frostInt - 1e-9) {
    c.frostTicks++;
    hurt(c, c.frostDmg, "frost", false);
  }
  if (c.frozenT >= c.freezeDur - 1e-9) c.frozen = false;
}

// 얼음밤의 검이 상대 몸에 닿는지 (검 날을 따라 점을 찍어서 확인)
function swordTouches(c, o) {
  const t = c.type, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const ca = Math.cos(c.swordAng), sa = Math.sin(c.swordAng), hw = t.swordHalfW;
  for (let r = t.swordInner; r <= t.swordTip; r += 15) {
    const px = cx + ca * r, py = cy + sa * r;
    if (px >= o.x - hw && px <= o.x + o.w + hw && py >= o.y - hw && py <= o.y + o.h + hw) return true;
  }
  return false;
}

// ----- 으아라아 행동 -----
function euaraaAct(c, prevVy, dt) {
  const t = c.type;
  moveBalloon(c, dt);

  // 풍선 더블점프: 점프 정점에서 확률적으로 성공
  if (prevVy < 0 && c.vy >= 0 && !c.jumpChecked) {
    c.jumpChecked = true;
    if (Math.random() < CONFIG.doubleJumpChance) {
      c.vy = -DOUBLE_JUMP_SPEED;
      c.doubleJumped = true;
      c.djText = 1.5;
    }
  }

  // 평타: 풍선으로 공격 (자신은 제외)
  for (const k in c.hitCd) c.hitCd[k] -= dt;
  for (const o of foesOf(c)) {
    if ((c.hitCd[o.id] || 0) > 0) continue;
    if (balloonsHit(c, o)) {
      const crit = Math.random() < t.critChance;
      hurt(o, crit ? t.hitDamage * t.critMult : t.hitDamage, "balloon", crit);
      c.hitCd[o.id] = t.hitInterval;
      c.flash = 0.3;
    }
  }

  // 능력: 10초마다 화내기
  c.rageCd -= dt;
  if (c.rageCd <= 0 && !c.rage) {
    c.rage = { t: 0, slams: 0 };
    c.rageCd = t.rageInterval;
  }
  if (c.rage) {
    c.rage.t += dt;
    const slamAt = 0.7 + c.rage.slams * 0.4;
    if (c.rage.slams < t.rageSlams && c.rage.t >= slamAt) {
      slam(c);
      c.rage.slams++;
    }
    if (c.rage.t >= 0.7 + t.rageSlams * 0.4 + 0.4) c.rage = null;
  }
}

// ----- 얼음밤 행동 -----
// ===== 돌진: 가장 가까운 적 캐릭터 방향으로 곧게 달려감 =====
function startDash(c) {
  const t = c.type, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const tg = nearestFoeChar(c, cx, cy);
  if (!tg) return false;
  const dx = tg.x + tg.w / 2 - cx, dy = tg.y + tg.h / 2 - cy, d = Math.hypot(dx, dy) || 1;
  c.dash = {
    t: 0, dur: Math.min(0.7, d / t.dashSpeed + 0.1), speed: t.dashSpeed,
    dx: dx / d, dy: dy / d, vx0: c.vx, vy0: c.vy, target: tg,
  };
  c.dashCd = t.dashInterval;
  c.msg = { text: "돌진!", t: 0.8 };
  return true;
}

function stepDash(c, dt) {
  const S = CONFIG.arenaSize, t = c.type, d = c.dash;
  d.t += dt;
  c.x += d.dx * d.speed * dt;
  c.y += d.dy * d.speed * dt;
  let end = d.t >= d.dur;
  if (c.x < 0 || c.x + c.w > S || c.y < 0 || c.y + c.h > S) {
    c.x = Math.max(0, Math.min(S - c.w, c.x)); c.y = Math.max(0, Math.min(S - c.h, c.y)); end = true;
  }
  for (const o of foesOf(c)) {
    if (!rectsOverlap(c, o)) continue;
    if (t.dashDamage) {                              // 조디악: 닿으면 대미지 (50%로 크리티컬)
      const crit = Math.random() < t.critChance;
      hurt(o, crit ? Math.round(t.dashDamage * t.critMult) : t.dashDamage, "dash", crit);
      c.flash = 0.2;
      shake = Math.max(shake, 0.2);
    }
    if (o === d.target || t.dashDamage) end = true;  // 목표(또는 처음 닿은 적)에게 닿으면 멈춤
    break;
  }
  if (end) {
    c.dash = null;
    c.vx = d.vx0; c.vy = d.vy0;                      // 돌진 전의 움직임으로 돌아감
  }
}

function dashTick(c, dt) {                           // 쿨타임이 되면 돌진 시작
  c.dashCd -= dt;
  if (c.dashCd <= 0 && !c.dash && !startDash(c)) c.dashCd = 0;
}

function zodiacAct(c, dt) { dashTick(c, dt); }

function iceAct(c, dt) {
  dashTick(c, dt);
  const t = c.type;

  // 평타: 검이 1초에 spinRps바퀴 돈다. 상대 몸에 닿을 때마다 대미지
  c.swordAng += t.spinRps * Math.PI * 2 * dt;
  for (const k in c.hitCd) c.hitCd[k] -= dt;
  for (const o of foesOf(c)) {
    if (swordTouches(c, o)) {
      if ((c.hitCd[o.id] || 0) <= 0) {
        hurt(o, t.hitDamage, "sword", false);
        c.hitCd[o.id] = 1 / t.spinRps;     // 계속 겹쳐 있으면 한 바퀴 돌 때마다 한 번씩
        c.flash = 0.15;
      }
    } else if ((c.hitCd[o.id] || 0) > t.touchGap) {
      c.hitCd[o.id] = t.touchGap;          // 떨어졌다 다시 닿으면 곧바로 적중 가능
    }
  }

  // 능력 얼음밤: 7초마다 아무 적을 얼린다 (아직 안 얼어있는 적을 우선)
  c.iceCd -= dt;
  if (c.iceCd <= 0) {
    const foes = chars.filter(o => o !== c && o.alive);
    if (foes.length) {
      const fresh = foes.filter(o => !o.frozen);
      const pool = fresh.length ? fresh : foes;
      freeze(c, pool[Math.floor(Math.random() * pool.length)]);
      c.msg = { text: "얼음밤!", t: 1.2 };
      c.iceCd = t.iceInterval;
    } else {
      c.iceCd = 0;
    }
  }
}

// ----- 호원 행동 -----
function spawnJelly(c) {
  const t = c.type, S = CONFIG.arenaSize;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const x = Math.max(0, Math.min(S - t.jellyW, cx - t.jellyW / 2 + (Math.random() - 0.5) * 300));
  const y = Math.max(0, Math.min(S - t.jellyH, cy - t.jellyH / 2 - 120 + (Math.random() - 0.5) * 200));
  const a = Math.random() * Math.PI * 2;
  minions.push({
    id: "m" + nextMid++, kind: "jelly", owner: c, type: t, name: "대변해파리",
    x, y, w: t.jellyW, h: t.jellyH,
    vx: Math.cos(a) * t.jellySpeed, vy: Math.sin(a) * t.jellySpeed,
    hp: t.jellyHp, maxHp: t.jellyHp, alive: true,
    spitCd: t.spitInterval,
  });
  effects.push({ kind: "puff", x: x + t.jellyW / 2, y: y + t.jellyH / 2, t: 0, dur: 0.5 });
}

function throwBun(c, target) {
  const t = c.type;
  shots.push({
    kind: "bun", owner: c, target, alive: true,
    x: c.x + c.w / 2, y: c.y + c.h * 0.2,
    ang: -Math.PI / 2 + (Math.random() - 0.5) * 1.4,   // 위로 던져 올린 뒤 유도됨
    speed: t.bunSpeed, turn: t.bunTurn, life: t.bunLife, r: 34, spin: 0,
  });
}

function howonAct(c, dt) {
  const t = c.type;

  // 능력1: 대변해파리 호빵족
  c.jellyCd -= dt;
  if (c.jellyCd <= 0) {
    spawnJelly(c);
    c.msg = { text: "대변해파리 호빵족!", t: 1.2, color: "#9a5a00" };
    c.jellyCd = t.jellyInterval;
  }

  // 능력2: 호빵 (유도탄). 가장 가까운 적을 쫓아간다
  c.bunCd -= dt;
  if (c.bunCd <= 0) {
    const tg = nearestFoeChar(c, c.x + c.w / 2, c.y + c.h / 2);
    if (tg) {
      throwBun(c, tg);
      c.msg = { text: "호빵!", t: 1.0, color: "#d97a00" };
      c.bunCd = t.bunInterval;
    } else {
      c.bunCd = 0;
    }
  }
}

// ----- 노션 행동 -----
function notionAct(c, dt) {
  const t = c.type;

  // 평타 커미션: 0.5초마다 가장 가까운 적이 있는 방향으로 동전 던지기 (유도 X)
  c.coinCd -= dt;
  if (c.coinCd <= 0) {
    const cx = c.x + c.w / 2, cy = c.y + c.h * 0.4;
    const tg = nearestFoeChar(c, cx, cy);
    if (tg) {
      shots.push({
        kind: "coin", owner: c, alive: true,                       // 목표를 따라가지 않음 (유도 X)
        x: cx, y: cy, ang: Math.atan2(tg.y + tg.h / 2 - cy, tg.x + tg.w / 2 - cx),
        speed: t.coinSpeed, life: 3, r: 20, spin: Math.random() * 6,
      });
      c.coinCd = t.coinInterval;
    } else {
      c.coinCd = 0;
    }
  }

  // 능력 거친면 소포체
  c.erCd -= dt;
  if (c.erCd <= 0 && !timeStop) {
    timeStop = { caster: c, t: 0, r: 0, maxR: Math.hypot(CONFIG.arenaSize, CONFIG.arenaSize), hit: new Set(), spawned: false };
    c.msg = { text: "거친면 소포체!", t: 2.6, color: "#b3001b" };
    c.erCd = t.erInterval;
  }
}

function spawnCells(c) {
  const t = c.type, S = CONFIG.arenaSize;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const base = Math.random() * Math.PI * 2;
  for (let i = 0; i < t.cellCount; i++) {
    const a = base + (i / t.cellCount) * Math.PI * 2;
    const x = Math.max(0, Math.min(S - t.cellSize, cx + Math.cos(a) * 230 - t.cellSize / 2));
    const y = Math.max(0, Math.min(S - t.cellSize, cy + Math.sin(a) * 230 - t.cellSize / 2));
    minions.push({
      id: "m" + nextMid++, kind: "cell", owner: c, type: t, name: "세포",
      x, y, w: t.cellSize, h: t.cellSize, vx: 0, vy: 0,
      hp: t.cellHp, maxHp: t.cellHp, alive: true, hitCd: {},
    });
    effects.push({ kind: "puff", x: x + t.cellSize / 2, y: y + t.cellSize / 2, t: 0, dur: 0.5 });
  }
}

// ----- 로블감수성 행동 -----
function robloxerAct(c, dt) {
  const t = c.type;
  c.floorCd -= dt;
  if (c.floorCd <= 0 && !timeStop) {
    if (chars.some(o => o !== c && o.alive)) {
      timeStop = { kind: "floor", caster: c, t: 0 };
      c.msg = { text: "FLOOR 10 REACHED", t: t.floorStop + 0.4, color: "#d4a300" };
      c.floorCd = t.floorInterval;
    } else {
      c.floorCd = 0;
    }
  }
}

// FLOOR 10 REACHED: 시간이 멈춰 있다가, 끝나는 순간 노랑·빨강 네모를 발사
function stepFloorStop(dt) {
  const ts = timeStop, c = ts.caster, t = c.type;
  ts.t += dt;
  if (ts.t < t.floorStop) return;
  const foes = chars.filter(o => o !== c && o.alive);
  const cx = c.x + c.w / 2, cy = c.y + c.h * 0.4;
  const first = foes.length ? foes[Math.floor(Math.random() * foes.length)] : null;
  const rest = foes.filter(o => o !== first);
  const second = rest.length ? rest[Math.floor(Math.random() * rest.length)] : first;     // 둘 이상이면 서로 다른 적을 노림
  [["#ffd400", first], ["#e01b1b", second]].forEach(([color, tg]) => {
    if (!tg) return;
    shots.push({
      kind: "floor", owner: c, target: tg, alive: true, color,     // 유도탄
      x: cx, y: cy, ang: Math.atan2(tg.y + tg.h / 2 - cy, tg.x + tg.w / 2 - cx),
      speed: t.floorSpeed, turn: t.floorTurn, life: t.floorLife, r: t.floorSize, spin: Math.random() * 6,
    });
  });
  shake = Math.max(shake, 0.2);
  timeStop = null;
}

// 인간의 한계: 속도 20% 감소, 5초. 중첩되지 않고 다시 맞으면 시간만 갱신
function floorHit(o, p) {
  const t = p.owner.type;
  hurt(o, t.floorDamage, "floor", false);
  if (o.type && o.type.hp && chars.includes(o)) {
    o.slowT = t.slowTime;
    if (!o.msg) o.msg = { text: "인간의 한계 도달!", t: 1.2, color: "#c0392b" };
  }
}

// 거친면 소포체가 발동하는 동안 모든 게 멈춘다 (캐릭터·소환수·투사체·시간)
//  1) 문양이 새겨짐  2) 파동이 퍼지며 닿는 적에게 대미지  3) 세포 소환 후 다시 흐름
function stepTimeStop(dt) {
  if (timeStop.kind === "floor") { stepFloorStop(dt); return; }
  const ts = timeStop, c = ts.caster, t = c.type;
  ts.t += dt;

  if (ts.t >= t.erEtch) {
    const p = Math.min(1, (ts.t - t.erEtch) / t.erWave);
    ts.r = p * ts.maxR;
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    for (const o of foesOf(c)) {
      if (ts.hit.has(o)) continue;
      if (Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy) <= ts.r) {
        ts.hit.add(o);
        hurt(o, t.waveDamage, "er", false);
      }
    }
    shake = Math.max(shake, 0.12);
  }

  if (!ts.spawned && ts.t >= t.erEtch + t.erWave) {
    ts.spawned = true;
    spawnCells(c);
  }

  if (ts.t >= t.erEtch + t.erWave + 0.4) {
    timeStop = null;
    chars = chars.filter(x => x.alive);
    minions = minions.filter(m => m.alive && m.owner.alive);
  }
}

// 소환수: 대변해파리는 둥둥 떠다니며 1초마다 가장 가까운 적에게 똥물을 뱉는다
// 캐릭터끼리 몸이 닿으면 서로 튕겨 나감 (+ 현자미는 닿을 때 대미지)
function bumpChars() {
  const S = CONFIG.arenaSize;
  const list = chars.filter(c => c.alive);
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if (ox <= 0 || oy <= 0) continue;
      for (const [p, q] of [[a, b], [b, a]]) {
        if (!p.type.contactDamage || !q.alive) continue;
        if ((p.contactAt[q.id] || -9) + p.type.contactGap > time) continue;
        p.contactAt[q.id] = time;
        hurt(q, p.type.contactDamage, "contact", false);
        p.flash = 0.15;
      }
      if (a.type.id === "paco" || b.type.id === "paco") continue;     // 파코엘은 블록 위로만 움직임
      const aFix = a.frozen || a.stunT > 0, bFix = b.frozen || b.stunT > 0;
      if (aFix && bFix) continue;
      const sa = aFix ? 0 : bFix ? 1 : 0.5, sb = bFix ? 0 : aFix ? 1 : 0.5;    // 멈춰 있는 쪽은 밀리지 않음
      if (ox < oy) {                                           // 옆에서 부딪힘
        const dir = (a.x + a.w / 2 < b.x + b.w / 2) ? -1 : 1;    // a가 튕겨 가는 방향
        a.x += dir * ox * sa; b.x -= dir * ox * sb;
        if (!aFix) a.vx = dir * Math.max(Math.abs(a.vx), 300);
        if (!bFix) b.vx = -dir * Math.max(Math.abs(b.vx), 300);
      } else {                                                 // 위아래로 부딪힘
        const dir = (a.y + a.h / 2 < b.y + b.h / 2) ? -1 : 1;    // -1이면 a가 위
        a.y += dir * oy * sa; b.y -= dir * oy * sb;
        if (!aFix) a.vy = dir < 0 ? -500 : 300;
        if (!bFix) b.vy = dir < 0 ? 300 : -500;
      }
      for (const c of [a, b]) {
        c.x = Math.max(0, Math.min(S - c.w, c.x));
        c.y = Math.max(0, Math.min(S - c.h, c.y));
      }
    }
  }
}

// ===== 파코엘: 블록 3개 위를 튕겨 다니는 코스 =====
// 블록 하나 = 위는 회색(천장에 붙음, 충돌/접촉 없음 · 그냥 배경) + 아래는 검정(바닥에 붙음). 둘이 한 높이에서 딱 만남.
// 파코엘은 블록 앞(화면상 앞)에 있고, 검정 블록 윗면 위에서만 일반 캐릭터처럼 중력 + 일정한 튕김으로 옆 블록으로 건너감.
// 3번 튕기면 코스(블록 높이)가 새로 바뀜.
function makeCourse(c) {
  const t = c.type, S = CONFIG.arenaSize, lo = t.minTop, hi = S - t.bottomMargin;
  let y = lo + Math.random() * (hi - lo);                     // 가장 밑 근처까지 랜덤
  c.cols.forEach(col => {
    col.bY = y;
    col.gray.h = y;                                           // 회색 아랫면 = 검정 윗면 (딱 만남)
    col.black.y = y; col.black.h = S - y;
    y = Math.max(lo, Math.min(hi, y + (Math.random() * 2 - 1) * t.maxStep));
  });
}

function makePillars(c) {
  const t = c.type, S = CONFIG.arenaSize, W = t.pillarW;
  c.cols = [-1, 0, 1].map(k => {
    const x = S / 2 - W / 2 + k * t.pillarGap;                // 경기장 중앙
    const gray = { owner: c, x, y: 0, w: W, h: 0, color: "#e4e4e4" };
    const black = { owner: c, x, y: S, w: W, h: 0, color: "#111" };
    pillars.push(gray, black);
    return { x, w: W, bY: S, gray, black };
  });
  makeCourse(c);
  c.jumpCount = 0;
  c.pidx = Math.floor(Math.random() * 3);
  c.pj = null;
  const col = c.cols[c.pidx];
  c.x = col.x + W / 2 - c.w / 2;
  c.y = col.bY - c.h;                                          // 검정 블록 위에 스폰
  c.vx = c.vy = 0;
}

function pacoAct(c, dt) {
  const t = c.type;
  if (!c.cols) return;
  if (!c.pj) {                                                 // 검정 블록 위: 바로 옆 블록으로 튕겨 감 (건너뛰지 않음)
    const col = c.cols[c.pidx];
    const adj = [c.pidx - 1, c.pidx + 1].filter(i => i >= 0 && i < 3);
    const tg = nearestFoeChar(c, c.x + c.w / 2, c.y + c.h / 2);
    let to = adj[Math.floor(Math.random() * adj.length)];
    if (tg && adj.length > 1 && Math.random() < 0.7) {         // 대체로 적과 가까운 쪽으로 (머리를 밟으려고)
      const dist = i => Math.abs(c.cols[i].x + c.cols[i].w / 2 - (tg.x + tg.w / 2));
      to = dist(adj[0]) < dist(adj[1]) ? adj[0] : adj[1];
    }
    const dst = c.cols[to];
    const y0 = col.bY - c.h, y1 = dst.bY - c.h;
    const g = CONFIG.gravity, v = BOUNCE_SPEED;                // 다른 캐릭터와 같은 튕김 속도
    // y(T) = y0 - v*T + g*T^2/2 = y1 이 되는 (내려오는 쪽) 시간 T
    const T = (v + Math.sqrt(Math.max(0, v * v - 2 * g * (y0 - y1)))) / g;
    c.pj = { t: 0, T, to, x0: col.x + col.w / 2 - c.w / 2, y0, x1: dst.x + dst.w / 2 - c.w / 2, y1, down: false };
  }
  const j = c.pj;
  j.t += dt;
  const s = Math.min(1, j.t / j.T);
  c.x = j.x0 + (j.x1 - j.x0) * s;
  c.y = j.y0 - BOUNCE_SPEED * j.t + 0.5 * CONFIG.gravity * j.t * j.t;
  j.down = j.t > BOUNCE_SPEED / CONFIG.gravity;                // 내려오는 중
  if (s >= 1) {                                                // 착지 (검정 블록 윗면)
    c.y = j.y1; c.x = j.x1; c.pidx = j.to; c.pj = null;
    if (++c.jumpCount >= t.courseJumps) {                      // 3번 튕겼으면 코스 변경
      c.jumpCount = 0;
      makeCourse(c);
      c.y = c.cols[c.pidx].bY - c.h;
      effects.push({ kind: "puff", x: c.x + c.w / 2, y: c.y + c.h, t: 0, dur: 0.5 });
      shake = Math.max(shake, 0.25);
    }
  }
  // 블록 / 파코엘 몸에 닿은 적: 5대미지, 내려오다 적의 머리를 밟으면 30대미지
  for (const o of chars) {
    if (o === c || !o.alive) continue;
    if (c.pj && c.pj.down && (c.stompAt[o.id] || -9) + t.stompGap <= time) {
      const feet = c.y + c.h;
      const ox = Math.min(c.x + c.w, o.x + o.w) - Math.max(c.x, o.x);
      if (ox > Math.min(c.w, o.w) * 0.3 && feet >= o.y && feet <= o.y + o.h * 0.4) {
        c.stompAt[o.id] = time; c.hitAt[o.id] = time;
        hurt(o, t.stompDamage, "stomp", true);
        shake = Math.max(shake, 0.2);
        continue;
      }
    }
    if ((c.hitAt[o.id] || -9) + t.touchGap > time) continue;
    const touching = rectsOverlap(c, o) || c.cols.some(k => rectsOverlap(k.black, o));   // 회색은 닿지 않음
    if (touching) { c.hitAt[o.id] = time; hurt(o, t.touchDamage, "touch", false); }
  }
}

// ===== H2K: X(공)를 튕겨 공격하고, X는 자신에게 되돌아옴 =====
function sportOf(c) { return c.type.sports[c.sport]; }

function h2kAct(c, dt) {
  const t = c.type;
  c.sportCd -= dt;
  if (c.sportCd <= 0) {                       // 5초마다 스포츠 바꾸기: 배드민턴 ↔ 탁구
    c.sport = c.sport === "badminton" ? "table" : "badminton";
    c.sportCd = t.sportInterval;
    c.msg = { text: "스포츠 바꾸기! " + sportOf(c).name, t: 1.5, color: "#0a8f3c" };
  }
  c.xCd -= dt;
  if (!c.xAlive && c.xCd <= 0) {
    const cx = c.x + c.w / 2, cy = c.y + c.h * 0.45;
    const tg = nearestFoeChar(c, cx, cy);
    if (!tg) return;
    shots.push({
      kind: "x", owner: c, alive: true, back: false, dist: 0, backT: 0,
      x: cx, y: cy, ang: Math.atan2(tg.y + tg.h / 2 - cy, tg.x + tg.w / 2 - cx),
      spin: 0, r: sportOf(c).r,
    });
    c.xAlive = true;
  }
}

function stepX(p, dt) {
  const c = p.owner, t = c.type, S = CONFIG.arenaSize;
  if (!c.alive) { p.alive = false; return; }
  const sp = sportOf(c);
  p.r = sp.r;
  p.spin += dt * 10;
  if (p.back) {                                 // 자신에게 되돌아옴 (점점 빨라져서 꼭 돌아옴)
    p.backT += dt;
    const tx = c.x + c.w / 2, ty = c.y + c.h * 0.45;
    p.ang = Math.atan2(ty - p.y, tx - p.x);
    const v = sp.speed * (1 + 2 * p.backT);
    p.x += Math.cos(p.ang) * v * dt;
    p.y += Math.sin(p.ang) * v * dt;
    const nx = Math.max(c.x, Math.min(p.x, c.x + c.w)), ny = Math.max(c.y, Math.min(p.y, c.y + c.h));
    if ((p.x - nx) ** 2 + (p.y - ny) ** 2 <= p.r * p.r) { p.alive = false; c.xAlive = false; c.xCd = t.xGap; }
    return;
  }
  p.x += Math.cos(p.ang) * sp.speed * dt;
  p.y += Math.sin(p.ang) * sp.speed * dt;
  p.dist += sp.speed * dt;
  if (p.x < 0 || p.x > S || p.y < 0 || p.y > S || p.dist > t.xRange) { p.back = true; return; }
  for (const o of foesOf(c)) {
    const nx = Math.max(o.x, Math.min(p.x, o.x + o.w)), ny = Math.max(o.y, Math.min(p.y, o.y + o.h));
    if ((p.x - nx) ** 2 + (p.y - ny) ** 2 > p.r * p.r) continue;
    const crit = sp.critChance > 0 && Math.random() < sp.critChance;
    hurt(o, crit ? Math.round(sp.damage * sp.critMult) : sp.damage, "x", crit);
    effects.push({ kind: "puff", x: p.x, y: p.y, t: 0, dur: 0.3 });
    p.back = true;                              // 맞추면 튕겨서 되돌아옴
    return;
  }
}

// 현자미: 2초마다 자기 위치에 바나나 껍질을 놓음
function hyunjamiAct(c, dt) {
  const t = c.type;
  c.peelCd -= dt;
  if (c.peelCd <= 0) {
    peels.push({ owner: c, alive: true, x: c.x + c.w / 2, y: c.y + c.h / 2, r: t.peelR, rot: Math.random() * 6.28 });
    if (peels.length > 60) peels.shift();
    c.peelCd = t.peelInterval;
  }
}

// 바나나 껍질: 주인이 아닌 캐릭터가 닿으면 껍질은 사라지고 대미지 + 잠깐 멈춤
function stepPeels() {
  for (const p of peels) {
    if (!p.alive) continue;
    for (const o of chars) {
      if (!o.alive || o === p.owner) continue;
      const nx = Math.max(o.x, Math.min(p.x, o.x + o.w));
      const ny = Math.max(o.y, Math.min(p.y, o.y + o.h));
      if ((p.x - nx) ** 2 + (p.y - ny) ** 2 > p.r * p.r) continue;
      p.alive = false;
      const t = p.owner.type;
      hurt(o, t.peelDamage, "peel", false);
      o.stunT = Math.max(o.stunT, t.peelStun);
      effects.push({ kind: "puff", x: p.x, y: p.y, t: 0, dur: 0.4 });
      break;
    }
  }
  peels = peels.filter(p => p.alive);
}

function stepMinions(dt) {
  const S = CONFIG.arenaSize;
  for (const m of minions) {
    if (!m.alive) continue;
    const t = m.type;

    // 세포: 가장 가까운 적을 쫓아가서, 닿으면 대미지
    if (m.kind === "cell") {
      const mx = m.x + m.w / 2, my = m.y + m.h / 2;
      const tg = nearestFoeChar(m.owner, mx, my);
      if (tg) {
        const dx = tg.x + tg.w / 2 - mx, dy = tg.y + tg.h / 2 - my, d = Math.hypot(dx, dy) || 1;
        m.x = Math.max(0, Math.min(S - m.w, m.x + dx / d * t.cellSpeed * dt));
        m.y = Math.max(0, Math.min(S - m.h, m.y + dy / d * t.cellSpeed * dt));
      }
      for (const k in m.hitCd) m.hitCd[k] -= dt;
      for (const o of chars) {
        if (o === m.owner || !o.alive || !rectsOverlap(m, o)) continue;
        if ((m.hitCd[o.id] || 0) <= 0) {
          hurt(o, t.cellDamage, "cell", false);
          m.hitCd[o.id] = t.cellHitGap;
        }
      }
      continue;
    }

    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < 0)           { m.x = 0;           m.vx =  Math.abs(m.vx); }
    if (m.x + m.w > S)     { m.x = S - m.w;     m.vx = -Math.abs(m.vx); }
    if (m.y < 0)           { m.y = 0;           m.vy =  Math.abs(m.vy); }
    if (m.y + m.h > S)     { m.y = S - m.h;     m.vy = -Math.abs(m.vy); }

    m.spitCd -= dt;
    if (m.spitCd <= 0) {
      const mx = m.x + m.w / 2, my = m.y + m.h * 0.45;
      const tg = nearestFoeChar(m.owner, mx, my);
      if (tg) {
        shots.push({
          kind: "spit", owner: m.owner, target: tg, alive: true,
          x: mx, y: my, ang: Math.atan2(tg.y + tg.h / 2 - my, tg.x + tg.w / 2 - mx),
          speed: t.spitSpeed, turn: 30, life: 3, r: 14, spin: 0,
        });
        m.spitCd = t.spitInterval;
      } else {
        m.spitCd = 0;
      }
    }
  }
}

// 동전(노션의 평타): 유도되지 않는다. 던진 방향으로 곧게 날아가다가 처음 닿는 적에게 대미지
function stepCoin(p, dt) {
  const S = CONFIG.arenaSize;
  p.x += Math.cos(p.ang) * p.speed * dt;
  p.y += Math.sin(p.ang) * p.speed * dt;
  p.spin += dt * 8;
  p.life -= dt;
  if (p.x < -60 || p.x > S + 60 || p.y < -60 || p.y > S + 60 || p.life <= 0) { p.alive = false; return; }
  for (const o of foesOf(p.owner)) {
    const nx = Math.max(o.x, Math.min(p.x, o.x + o.w));
    const ny = Math.max(o.y, Math.min(p.y, o.y + o.h));
    if ((p.x - nx) ** 2 + (p.y - ny) ** 2 <= p.r * p.r) {
      hurt(o, p.owner.type.coinDamage, "coin", false);
      p.alive = false;
      return;
    }
  }
}

// 투사체(호빵 / 똥물): 목표를 향해 방향을 꺾으며 날아가고, 닿으면 대미지
function stepShots(dt) {
  for (const p of shots) {
    if (!p.alive) continue;
    if (p.kind === "x") { stepX(p, dt); continue; }
    if (p.kind === "coin") { stepCoin(p, dt); continue; }     // 동전은 직선으로 날아감 (유도 X)
    if (!p.target || !p.target.alive) {                 // 목표가 쓰러지면 가장 가까운 적으로 갈아탐
      p.target = nearestFoeChar(p.owner, p.x, p.y);
      if (!p.target) { p.alive = false; continue; }
    }
    const tg = p.target;
    const want = Math.atan2(tg.y + tg.h / 2 - p.y, tg.x + tg.w / 2 - p.x);
    let d = want - p.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const maxTurn = p.turn * dt;
    p.ang += Math.max(-maxTurn, Math.min(maxTurn, d));
    p.x += Math.cos(p.ang) * p.speed * dt;
    p.y += Math.sin(p.ang) * p.speed * dt;
    p.spin += dt * 8;
    p.life -= dt;

    const nx = Math.max(tg.x, Math.min(p.x, tg.x + tg.w));
    const ny = Math.max(tg.y, Math.min(p.y, tg.y + tg.h));
    if ((p.x - nx) ** 2 + (p.y - ny) ** 2 <= p.r * p.r) {
      const t = p.owner.type;
      if (p.kind === "bun") {
        const crit = Math.random() < t.bunCritChance;
        hurt(tg, crit ? Math.round(t.bunDamage * t.bunCritMult) : t.bunDamage, "bun", crit);
        effects.push({ kind: "puff", x: p.x, y: p.y, t: 0, dur: 0.5 });
        shake = Math.max(shake, 0.15);
      } else if (p.kind === "floor") {
        floorHit(tg, p);
      } else {
        hurt(tg, t.spitDamage, "spit", false);
      }
      p.alive = false;
    } else if (p.life <= 0) {
      p.alive = false;
    }
  }
  shots = shots.filter(p => p.alive);
}

function step(dt) {
  if (timeStop) { stepTimeStop(dt); return; }     // 거친면 소포체 중에는 모든 게 멈춤
  const S = CONFIG.arenaSize;
  time += dt;

  for (const c of chars) {
    if (!c.alive) continue;

    if (c.slowT > 0) c.slowT = Math.max(0, c.slowT - dt);

    if (c.stunT > 0) c.stunT = Math.max(0, c.stunT - dt);

    // 얼어있거나(동상 대미지만 받음) 멈춤 상태면 제자리에 멈춤
    if (c.frozen || c.stunT > 0) {
      if (c.type.id === "hyunjami") c.peelCd = Math.max(0, c.peelCd - dt);
      if (c.type.id === "h2k") { c.sportCd = Math.max(0, c.sportCd - dt); c.xCd = Math.max(0, c.xCd - dt); }
      c.dash = null;                                            // 얼면 돌진도 멈춤
      if (c.type.dashInterval) c.dashCd = Math.max(0, c.dashCd - dt);
      if (c.type.rageInterval) c.rageCd = Math.max(0, c.rageCd - dt);   // 쿨타임은 계속 흐름
      if (c.type.id === "howon") { c.jellyCd = Math.max(0, c.jellyCd - dt); c.bunCd = Math.max(0, c.bunCd - dt); }
      if (c.type.id === "robloxer") c.floorCd = Math.max(0, c.floorCd - dt);
      if (c.type.id === "notion") { c.coinCd = Math.max(0, c.coinCd - dt); c.erCd = Math.max(0, c.erCd - dt); }
      if (c.frozen) updateFrozen(c, dt);
      continue;
    }

    if (c.type.id === "paco") { pacoAct(c, dt); continue; }     // 블록 위로만 점프해서 이동

    // --- 이동 / 중력 ---
    const prevVy = c.vy;
    if (c.dash) {                                    // 돌진 중: 중력 무시하고 곧게 이동
      stepDash(c, dt);
      if (c.type.id === "ice") iceAct(c, dt); else if (c.type.id === "zodiac") zodiacAct(c, dt);
      continue;
    }
    const mdt = c.slowT > 0 ? dt * SLOW_MUL : dt;     // 인간의 한계: 느려진 만큼 시간이 천천히 흐름
    c.vy += CONFIG.gravity * mdt;
    c.x += c.vx * mdt;
    c.y += c.vy * mdt;

    if (c.x < 0)         { c.x = 0;         c.vx =  Math.abs(c.vx); }
    if (c.x + c.w > S)   { c.x = S - c.w;   c.vx = -Math.abs(c.vx); }
    if (c.y < 0)         { c.y = 0;         c.vy =  Math.abs(c.vy); }
    if (c.y + c.h > S) {                    // 바닥: 항상 같은 높이로 튕김
      c.y = S - c.h;
      c.vy = -BOUNCE_SPEED;
      c.jumpChecked = false;
      if (c.doubleJumped) { c.doubleJumped = false; wave(c); }
    }

    if (c.type.id === "euaraa") euaraaAct(c, prevVy, dt);
    else if (c.type.id === "ice") iceAct(c, dt);
    else if (c.type.id === "howon") howonAct(c, dt);
    else if (c.type.id === "notion") notionAct(c, dt);
    else if (c.type.id === "robloxer") robloxerAct(c, dt);
    else if (c.type.id === "hyunjami") hyunjamiAct(c, dt);
    else if (c.type.id === "h2k") h2kAct(c, dt);
    else if (c.type.id === "zodiac") zodiacAct(c, dt);
  }

  bumpChars();
  stepMinions(dt);
  stepShots(dt);
  stepPeels();

  // 패시브 서든데스: 상대 체력이 기준 이하가 되면 그 캐릭터는 체력 0으로 죽는다.
  //  - 1대 1(살아있는 캐릭터가 둘뿐)이면 얼음밤이 바로 승리하고 경기 끝
  //  - 3명 이상이면 그 캐릭터만 죽고 경기는 계속
  for (const c of chars) {
    if (over) break;
    if (!c.alive || c.type.id !== "ice") continue;
    for (const o of chars) {
      if (o === c || !o.alive || o.hp > c.type.suddenHp) continue;
      const aliveN = chars.filter(x => x.alive).length;
      o.hp = 0;
      o.alive = false;
      floaters.push({ x: o.x + o.w / 2, y: o.y + o.h * 0.3, text: "서든데스!", kind: "sudden", crit: false, t: 0 });
      c.msg = { text: "서든데스 발동!", t: 3 };
      shake = 0.4;
      if (aliveN <= 2) {
        sudden = { by: c.name, victim: o.name };
        endGame(c);
        break;
      }
      suddenNote = { by: c.name, victim: o.name, t: 2.5 };   // 경기는 계속, 잠깐 안내만 띄움
    }
  }

  // 쓰러진 캐릭터 제거 + 승패 판정
  chars = chars.filter(c => c.alive);
  pillars = pillars.filter(p => p.owner.alive);     // 주인이 쓰러지면 블록도 사라짐
  minions = minions.filter(m => m.alive && m.owner.alive);   // 주인이 쓰러지면 소환수도 사라짐
  if (peak >= 2 && chars.length <= 1 && !over) endGame(chars[0] || null);
}

// 이펙트 / 숫자 / 말풍선 타이머 (실제 시간 기준)
function updateFx(dt) {
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.t < e.dur);
  for (const f of floaters) { f.t += dt; f.y -= 120 * dt; }
  floaters = floaters.filter(f => f.t < 1.0);
  for (const c of chars) {
    if (c.djText > 0) c.djText -= dt;
    if (c.flash > 0) c.flash -= dt;
    if (c.msg) { c.msg.t -= dt; if (c.msg.t <= 0) c.msg = null; }
  }
  if (shake > 0) shake -= dt;
  if (suddenNote) { suddenNote.t -= dt; if (suddenNote.t <= 0) suddenNote = null; }
}

// ===== 그리기 =====
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
// 체력 표시: 200.889처럼 소수점이 있으면 그대로 보여줌
function fmtHp(v) { return String(Math.round(v * 1000) / 1000); }

function label(text, x, y, size, fill, stroke) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = "center";
  ctx.lineJoin = "round";
  ctx.lineWidth = size / 6;
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function drawKeyboard(x, bottom) {
  const w = 380, h = 120, left = x - w / 2, top = bottom - h;
  ctx.fillStyle = "#333";
  ctx.fillRect(left, top, w, h);
  ctx.fillStyle = "#ddd";
  const cols = 12, rows = 4, pad = 10;
  const kw = (w - pad * (cols + 1)) / cols, kh = (h - pad * (rows + 1)) / rows;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      ctx.fillRect(left + pad + c * (kw + pad), top + pad + r * (kh + pad), kw, kh);
}

// 파코엘의 블록: 위(천장)에 붙은 회색, 아래(바닥)에서 올라온 검정. 검정 위에 서서 점프
function drawPillar(p) {
  if (p.h <= 0) return;
  ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.strokeRect(p.x, p.y, p.w, p.h);
}

// 바나나 껍질 (2D 도형): 노란 껍질 조각 4장이 펼쳐진 모양
function drawPeel(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  const r = p.r;
  for (let i = 0; i < 4; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 2 + 0.3);
    ctx.beginPath();
    ctx.ellipse(r * 0.55, 0, r * 0.62, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#f7d51d"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#7a5a00"; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(r * 0.45, 0, r * 0.3, r * 0.1, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff3a0"; ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = "#c9a400"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#7a5a00"; ctx.stroke();
  ctx.restore();
}

// 파란 검 (2D 도형으로 그림). 몸 중심에서 swordAng 방향으로 뻗어 있음
function drawSword(c) {
  const t = c.type, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  const hit = c.flash > 0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(c.swordAng);
  ctx.lineJoin = "round";

  // 손잡이 끝(폼멜)
  ctx.beginPath();
  ctx.arc(52, 0, 13, 0, Math.PI * 2);
  ctx.fillStyle = "#16307f";
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#0a1a4d"; ctx.stroke();

  // 손잡이
  ctx.fillStyle = "#1b2f8f";
  ctx.fillRect(60, -9, 42, 18);
  ctx.strokeStyle = "#0a1a4d";
  ctx.strokeRect(60, -9, 42, 18);
  ctx.beginPath();                                   // 손잡이 감은 줄무늬
  for (let x = 68; x < 100; x += 9) { ctx.moveTo(x, -9); ctx.lineTo(x + 5, 9); }
  ctx.strokeStyle = "#5b86ff"; ctx.lineWidth = 2; ctx.stroke();

  // 가드(날밑)
  ctx.fillStyle = "#2f66e8";
  ctx.fillRect(100, -34, 14, 68);
  ctx.lineWidth = 3; ctx.strokeStyle = "#0a1a4d";
  ctx.strokeRect(100, -34, 14, 68);

  // 날
  const inner = t.swordInner, tip = t.swordTip, hw = t.swordHalfW;
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, "#9cc4ff");
  g.addColorStop(0.5, "#4a86f5");
  g.addColorStop(1, "#1a4ed0");
  ctx.beginPath();
  ctx.moveTo(inner, -hw);
  ctx.lineTo(tip - 38, -hw);
  ctx.lineTo(tip, 0);
  ctx.lineTo(tip - 38, hw);
  ctx.lineTo(inner, hw);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = hit ? 8 : 4;
  ctx.strokeStyle = hit ? "#e11" : "#0d2a8a";
  ctx.stroke();

  // 날 가운데 홈(반짝이는 선)
  ctx.beginPath();
  ctx.moveTo(inner + 10, 0);
  ctx.lineTo(tip - 30, 0);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(220,235,255,0.9)";
  ctx.stroke();
  ctx.restore();
}

// 대변해파리 (2D 도형): 똥 모양 위에 얼굴이 있는 해파리
function drawJelly(m) {
  const now = performance.now() / 1000;
  const cx = m.x + m.w / 2, bob = Math.sin(now * 3 + m.x * 0.01) * 6;
  const top = m.y + bob, w = m.w, h = m.h;
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  // 촉수 (살랑살랑)
  ctx.strokeStyle = "#8a5a22";
  ctx.lineWidth = 9;
  for (let i = 0; i < 5; i++) {
    const bx = cx - w * 0.36 + i * (w * 0.18);
    ctx.beginPath();
    ctx.moveTo(bx, top + h * 0.58);
    for (let k = 1; k <= 6; k++) {
      const yy = top + h * 0.58 + k * (h * 0.42 / 6);
      ctx.lineTo(bx + Math.sin(now * 5 + i * 1.3 + k * 0.9) * 8, yy);
    }
    ctx.stroke();
  }

  // 몸통(반투명 돔)
  ctx.beginPath();
  ctx.ellipse(cx, top + h * 0.58, w * 0.5, h * 0.42, 0, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = "rgba(150,98,40,0.88)";
  ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "#4a2c0f"; ctx.stroke();

  // 똥 소용돌이 (위로 갈수록 작은 3단 + 뾰족한 끝)
  ctx.fillStyle = "#7a4a18";
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.17, w * 0.30, h * 0.075, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.075, w * 0.21, h * 0.065, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w * 0.11, top + h * 0.05); ctx.lineTo(cx + w * 0.02, top - h * 0.07); ctx.lineTo(cx + w * 0.11, top + h * 0.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 얼굴
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(cx - w * 0.18, top + h * 0.40, 11, 0, Math.PI * 2); ctx.arc(cx + w * 0.18, top + h * 0.40, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(cx - w * 0.16, top + h * 0.41, 5, 0, Math.PI * 2); ctx.arc(cx + w * 0.20, top + h * 0.41, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, top + h * 0.53, 13, 10, 0, 0, Math.PI * 2); ctx.fillStyle = "#3a1d08"; ctx.fill();   // 똥물을 뱉는 입

  // 체력바
  const by = m.y - 28;
  ctx.fillStyle = "#fff"; ctx.fillRect(m.x, by, w, 16);
  ctx.fillStyle = "#2ecc71"; ctx.fillRect(m.x, by, w * (m.hp / m.maxHp), 16);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeRect(m.x, by, w, 16);
  label(Math.ceil(m.hp) + "/" + m.maxHp, cx, by - 6, 24, "#000", "#fff");
}

// 호빵 / 똥물 투사체
// 세포 (2D 도형): 울퉁불퉁한 세포막 + 핵 + 눈
function drawCell(m) {
  const now = performance.now() / 1000;
  const r = m.w / 2, cx = m.x + r, cy = m.y + r + Math.sin(now * 6 + m.x * 0.02) * 4;
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = i / 28 * Math.PI * 2, rr = r * (1 + 0.07 * Math.sin(a * 5 + now * 4));
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(214,60,80,0.9)"; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "#3a0010"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.15, cy + r * 0.2, r * 0.36, 0, Math.PI * 2);   // 핵
  ctx.fillStyle = "#5a0020"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#1a0006"; ctx.stroke();
  for (const dx of [-0.32, 0.32]) {                                                   // 눈
    ctx.beginPath(); ctx.arc(cx + r * dx, cy - r * 0.3, 8, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * dx, cy - r * 0.27, 4, 0, Math.PI * 2); ctx.fillStyle = "#111"; ctx.fill();
  }
}

// 거친면 소포체 문양: 납작한 주머니가 겹겹이 쌓이고 표면에 리보솜(점)이 붙은 모양
function drawER(cx, cy, p) {
  const R = 330;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const g = ctx.createRadialGradient(0, 0, 20, 0, 0, R);
  g.addColorStop(0, "rgba(179,0,27," + (0.35 * p) + ")");
  g.addColorStop(1, "rgba(179,0,27,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  // 바깥 고리: 새겨지듯 한 바퀴 돌며 그려짐
  const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * p;
  ctx.strokeStyle = "#1a0006"; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(0, 0, R * 0.95, a0, a1); ctx.stroke();
  ctx.strokeStyle = "#b3001b"; ctx.lineWidth = 5;  ctx.beginPath(); ctx.arc(0, 0, R * 0.88, a0, a1); ctx.stroke();
  // 주머니 + 리보솜
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R * 0.84, 0, Math.PI * 2); ctx.clip();
  const sacs = 5;
  for (let i = 0; i < sacs; i++) {
    const y0 = (i - (sacs - 1) / 2) * 74;
    const reveal = Math.max(0, Math.min(1, p * 1.5 - i * 0.12));
    if (reveal <= 0) continue;
    const x0 = -R * 0.8, x1 = x0 + 2 * R * 0.8 * reveal;
    const yy = x => y0 + Math.sin(x * 0.018 + i * 1.4) * 20 + Math.sin(x * 0.007 + i) * 10;
    for (const [lw, col] of [[34, "#1a0006"], [22, "#8b0f1f"]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
      for (let x = x0; x <= x1; x += 8) { if (x === x0) ctx.moveTo(x, yy(x)); else ctx.lineTo(x, yy(x)); }
      ctx.stroke();
    }
    ctx.fillStyle = "#0b0003";
    for (let x = x0 + 14; x <= x1; x += 26) {
      const y = yy(x);
      ctx.beginPath(); ctx.arc(x, y - 24, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 13, y + 24, 5.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawTimeStopBack() {
  if (timeStop.kind === "floor") {
    ctx.fillStyle = "rgba(0,0,0," + (0.35 * Math.min(1, timeStop.t / 0.25)) + ")";     // 시간이 멈춘 듯 어두워짐
    ctx.fillRect(-100, -100, CONFIG.arenaSize + 200, CONFIG.arenaSize + 200);
    return;
  }
  const ts = timeStop, c = ts.caster, t = c.type, S = CONFIG.arenaSize;
  ctx.fillStyle = "rgba(60,0,10," + (0.22 * Math.min(1, ts.t / 0.3)) + ")";    // 시간이 멈춘 듯 붉게 어두워짐
  ctx.fillRect(-100, -100, S + 200, S + 200);
  drawER(c.x + c.w / 2, c.y + c.h / 2, Math.min(1, ts.t / t.erEtch));
}

function drawFloorFront() {
  const ts = timeStop, c = ts.caster, t = c.type, S = CONFIG.arenaSize;
  const k = Math.min(1, ts.t / (t.floorStop * 0.8));
  const cx = c.x + c.w / 2, cy = c.y + c.h * 0.4, sz = t.floorSize * 2 * (0.3 + 0.7 * k);
  [["#ffd400", -1], ["#e01b1b", 1]].forEach(([col, dir]) => {      // 발사를 기다리는 노랑 / 빨강 네모
    const x = cx + dir * (c.w / 2 + 40), y = cy - 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ts.t * 3 * dir);
    ctx.fillStyle = col; ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
    ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  });
  ctx.save();
  ctx.globalAlpha = Math.min(1, ts.t / 0.2);
  label("FLOOR 10 REACHED", S / 2, S * 0.45, 130, "#ffd400", "#000");
  ctx.restore();
}

function drawTimeStopWave() {
  if (timeStop.kind === "floor") { drawFloorFront(); return; }
  const ts = timeStop, c = ts.caster;
  if (!(ts.r > 0)) return;
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  ctx.save();
  ctx.globalAlpha = 1 - 0.5 * Math.min(1, ts.r / ts.maxR);
  ctx.beginPath(); ctx.arc(cx, cy, ts.r, 0, Math.PI * 2); ctx.strokeStyle = "#b3001b"; ctx.lineWidth = 46; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, ts.r - 34), 0, Math.PI * 2); ctx.strokeStyle = "#1a0006"; ctx.lineWidth = 12; ctx.stroke();
  ctx.restore();
}

function drawShot(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.kind === "coin") {
    const sx = Math.max(0.15, Math.abs(Math.cos(p.spin)));      // 빙글빙글 도는 동전
    ctx.beginPath(); ctx.ellipse(0, 0, p.r * sx, p.r, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#f4c430"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#8a6a00"; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, p.r * sx * 0.6, p.r * 0.6, 0, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = "#c9971a"; ctx.stroke();
  } else if (p.kind === "x") {
    // 알파벳 X (스포츠에 따라 색이 바뀜). 빙글빙글 돌며 날아감
    const col = { base: "#222", badminton: "#0a8f3c", table: "#ff7a00" }[p.owner.sport] || "#222";
    ctx.rotate(p.spin * 0.6);
    ctx.font = "900 " + Math.round(p.r * 3.2) + "px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = 8; ctx.strokeStyle = "#fff"; ctx.strokeText("X", 0, 0);
    ctx.fillStyle = col; ctx.fillText("X", 0, 0);
    ctx.textBaseline = "alphabetic";
  } else if (p.kind === "floor") {
    ctx.rotate(p.spin * 0.5);
    ctx.fillStyle = p.color; ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
    ctx.lineWidth = 6; ctx.strokeStyle = "#000"; ctx.strokeRect(-p.r, -p.r, p.r * 2, p.r * 2);
  } else if (p.kind === "spit") {
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#6b4a12"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#2f1f06"; ctx.stroke();
    ctx.beginPath(); ctx.arc(-4, -4, 4, 0, Math.PI * 2); ctx.fillStyle = "#b08a3a"; ctx.fill();
  } else {
    // 김이 모락모락 (날아온 반대 방향으로 꼬리)
    ctx.strokeStyle = "rgba(160,160,160,0.7)"; ctx.lineWidth = 6; ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-Math.cos(p.ang) * 40 - Math.sin(p.ang) * i * 16, -Math.sin(p.ang) * 40 + Math.cos(p.ang) * i * 16);
      ctx.lineTo(-Math.cos(p.ang) * 90 - Math.sin(p.ang) * i * 22, -Math.sin(p.ang) * 90 + Math.cos(p.ang) * i * 22);
      ctx.stroke();
    }
    ctx.rotate(p.spin);
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff4d8"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#c9a46a"; ctx.stroke();
    ctx.beginPath();                                   // 윗면 주름
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.quadraticCurveTo(Math.cos(a + 0.4) * 16, Math.sin(a + 0.4) * 16, Math.cos(a) * 26, Math.sin(a) * 24);
    }
    ctx.lineWidth = 3; ctx.strokeStyle = "#d9bf8c"; ctx.stroke();
  }
  ctx.restore();
}

// 얼음 이펙트: 얼음밤에서 대상까지 번쩍이는 줄기
function drawIceBolt(e) {
  const p = e.t / e.dur;
  const dx = e.x2 - e.x1, dy = e.y2 - e.y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len, seg = Math.max(4, Math.floor(len / 50));
  ctx.beginPath();
  ctx.moveTo(e.x1, e.y1);
  for (let i = 1; i < seg; i++) {
    const k = i / seg, j = (i % 2 ? 1 : -1) * 30;
    ctx.lineTo(e.x1 + dx * k + nx * j, e.y1 + dy * k + ny * j);
  }
  ctx.lineTo(e.x2, e.y2);
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(90,200,255," + (1 - p) + ")";
  ctx.lineWidth = 22;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255," + (1 - p) + ")";
  ctx.lineWidth = 8;
  ctx.stroke();
}

// 얼음 덩어리 (얼어있는 캐릭터 위에 덮음)
function drawIceBlock(c) {
  const x = c.x - 8, y = c.y - 8, w = c.w + 16, h = c.h + 16;
  ctx.fillStyle = "rgba(150,225,255,0.55)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#2ab0f0";
  ctx.lineWidth = 8;
  ctx.strokeRect(x, y, w, h);
  ctx.beginPath();                                   // 얼음 반사광
  ctx.moveTo(x + w * 0.12, y + h * 0.35); ctx.lineTo(x + w * 0.45, y + 12);
  ctx.moveTo(x + w * 0.12, y + h * 0.55); ctx.lineTo(x + w * 0.7, y + 12);
  ctx.moveTo(x + w * 0.5, y + h - 12);    ctx.lineTo(x + w - 12, y + h * 0.5);
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 6;
  ctx.stroke();
  label("❄ 동상", c.x + c.w / 2, c.y + c.h / 2, 60, "#fff", "#2ab0f0");
}

function draw() {
  const S = CONFIG.arenaSize;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#fff";                 // 투명하면 영상에서 검정으로 나오므로 흰 배경을 칠함
  ctx.fillRect(0, 0, S, S);
  if (shake > 0) {
    const m = 40 * (shake / 0.3);
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  for (const p of pillars) drawPillar(p);
  if (timeStop) drawTimeStopBack();

  // 파동
  for (const e of effects) {
    if (e.kind !== "wave") continue;
    const p = e.t / e.dur;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * p, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,0,0," + (1 - p) + ")";
    ctx.lineWidth = 14;
    ctx.stroke();
  }

  // 캐릭터
  for (const c of chars) {
    const t = c.type;
    if (t.id === "ice") drawSword(c);                 // 검은 등뒤에 있으니 몸 아래에 그림
    if (t.ready) ctx.drawImage(t.img, c.x, c.y, c.w, c.h);

    if (t.id === "euaraa") {
      // 줄(이미지 중앙) + 풍선(도형)
      const bt = t.balloon, p = c.bal;
      const ax = c.x + c.w / 2, ay = c.y + c.h / 2;
      const ang = Math.atan2(ay - p.y, ax - p.x);
      const tx = p.x + Math.cos(ang) * bt.r, ty = p.y + Math.sin(ang) * bt.r;   // 풍선에서 줄이 나오는 점
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(tx, ty);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#222";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ax, ay, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#222";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, bt.r, 0, Math.PI * 2);
      ctx.fillStyle = bt.color;
      ctx.fill();
      ctx.lineWidth = c.flash > 0 ? 10 : 4;           // 적중하면 빨간 굵은 테두리
      ctx.strokeStyle = c.flash > 0 ? "#e11" : "#222";
      ctx.stroke();
      ctx.beginPath();                                // 반짝이는 하이라이트
      ctx.ellipse(p.x - bt.r * 0.35, p.y - bt.r * 0.4, bt.r * 0.2, bt.r * 0.12, -0.6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fill();
    }

    if (c.frozen) drawIceBlock(c);
    if (c.type.id === "h2k" && !c.msg) label(sportOf(c).name, c.x + c.w / 2, Math.max(c.y - 40, 70) - 52, 30, "#0a8f3c", "#fff");
    if (c.stunT > 0) {                              // 바나나 껍질: 멈춤 표시
      ctx.fillStyle = "rgba(247,213,29,0.25)"; ctx.fillRect(c.x, c.y, c.w, c.h);
      label("멈춤 " + c.stunT.toFixed(1) + "초", c.x + c.w / 2, Math.max(c.y - 40, 70) + 70, 30, "#8a6a00", "#fff");
    }
    if (c.slowT > 0) {                              // 인간의 한계: 느려지는 동안 표시
      ctx.fillStyle = "rgba(192,57,43,0.18)"; ctx.fillRect(c.x, c.y, c.w, c.h);
      label("느림 " + c.slowT.toFixed(1) + "초", c.x + c.w / 2, Math.max(c.y - 40, 70) + 70, 30, "#c0392b", "#fff");
    }

    const barH = 24;
    const by = Math.max(c.y - 40, 70);
    ctx.fillStyle = "#fff";
    ctx.fillRect(c.x, by, c.w, barH);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(c.x, by, c.w * (c.hp / t.hp), barH);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 4;
    ctx.strokeRect(c.x, by, c.w, barH);
    label(c.name + "  " + fmtHp(c.hp) + "/" + fmtHp(t.hp), c.x + c.w / 2, by - 12, 34, "#000", "#fff");

    if (c.djText > 0) label("풍선달린 왕관점프!", c.x + c.w / 2, by - 70, 52, "#d98c00", "#000");
    if (c.msg) label(c.msg.text, c.x + c.w / 2, by - 70, 56, c.msg.color || "#1f4fd6", "#fff");
    if (c.rage && c.rage.t < 2.0) label(t.rageShout, c.x + c.w / 2, by - 135, 56, "#e11", "#000");
  }

  // 소환수 / 투사체
  for (const p of peels) drawPeel(p);
  for (const m of minions) { if (m.kind === "cell") drawCell(m); else drawJelly(m); }
  for (const p of shots) drawShot(p);
  for (const e of effects) {
    if (e.kind !== "puff") continue;
    const p = e.t / e.dur;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 20 + 70 * p, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(200,140,40," + (1 - p) + ")";
    ctx.lineWidth = 12;
    ctx.stroke();
  }

  // 얼음 줄기
  for (const e of effects) if (e.kind === "ice") drawIceBolt(e);

  // 키보드
  for (const e of effects) {
    if (e.kind !== "kb") continue;
    const p = e.t / e.dur;
    let bottom, alpha = 1;
    if (p < 0.5) bottom = e.y - 600 + (p / 0.5) * 620;
    else { bottom = e.y + 20; alpha = 1 - (p - 0.5) / 0.5; }
    ctx.globalAlpha = alpha;
    drawKeyboard(e.x, bottom);
    ctx.globalAlpha = 1;
  }

  if (timeStop) drawTimeStopWave();

  // 대미지 숫자
  for (const f of floaters) {
    const color = f.crit ? "#e11" : f.kind === "wave" ? "#1a6dd6" : f.kind === "rage" ? "#8a2be2"
                : f.kind === "frost" ? "#0aa5d8" : f.kind === "sword" ? "#1f4fd6" : f.kind === "sudden" ? "#e11" : f.kind === "bun" ? "#d97a00" : f.kind === "spit" ? "#6b4a12" : f.kind === "coin" ? "#a67c00" : f.kind === "floor" ? "#d4a300" : f.kind === "peel" ? "#a68900" : f.kind === "stomp" ? "#111" : f.kind === "touch" ? "#555" : f.kind === "x" ? "#0a8f3c" : f.kind === "contact" ? "#555" : f.kind === "er" ? "#b3001b" : f.kind === "cell" ? "#c2185b" : "#000";
    ctx.globalAlpha = 1 - f.t;
    label(f.text, f.x, f.y, f.crit ? 76 : f.kind === "sudden" ? 90 : f.kind === "spit" || f.kind === "coin" || f.kind === "cell" ? 34 : f.kind === "er" ? 84 : 54, color, "#fff");
    ctx.globalAlpha = 1;
  }

  // 서든데스 안내 (3명 이상일 때: 경기는 계속)
  if (suddenNote && !over) {
    ctx.globalAlpha = Math.min(1, suddenNote.t / 0.6);
    label("⚡ 서든데스 발동!", S / 2, 240, 90, "#1f4fd6", "#fff");
    label(suddenNote.victim + "의 체력이 " + TYPES.ice.suddenHp + " 이하 → 0!", S / 2, 320, 50, "#000", "#fff");
    ctx.globalAlpha = 1;
  }

  // 서든데스 / 승리 표시
  if (sudden) {
    label("⚡ 서든데스 발동!", S / 2, S / 2 - 440, 110, "#1f4fd6", "#fff");
    label(sudden.victim + "의 체력이 " + TYPES.ice.suddenHp + " 이하 → 0!", S / 2, S / 2 - 340, 60, "#000", "#fff");
  }
  if (over) {
    label(winner ? winner.name + " 승리!" : "무승부!", S / 2, S / 2, 220, "#000", "#fff");
  }
}

function fmt(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
}

// ===== 경기 영상 녹화 / 다시보기 / 다운로드 =====
let rec = null, recChunks = [], recExt = "mp4", recUrl = null, recTimer = null;

// MP4를 우선 사용하고, 지원하지 않는 브라우저(예: 파이어폭스)는 WEBM으로 대체
function pickMime() {
  if (typeof MediaRecorder === "undefined") return "";
  const list = ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1", "video/mp4",
                "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return list.find(m => MediaRecorder.isTypeSupported(m)) || "";
}

function setStatus(text, recording) {
  recStatus.textContent = text;
  recStatus.className = recording ? "recording" : "";
}

function startRecording() {
  const mime = pickMime();
  if (!mime || !canvas.captureStream) { setStatus("이 브라우저는 영상 녹화를 지원하지 않아요", false); return; }
  recChunks = [];
  recExt = mime.startsWith("video/mp4") ? "mp4" : "webm";
  try {
    rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6000000 });
  } catch (e) { rec = null; setStatus("영상 녹화를 시작하지 못했어요", false); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.start(1000);
  setStatus("● 녹화 중", true);
}

function stopRecording(discard) {
  clearTimeout(recTimer);
  const r = rec;
  if (!r) return;
  rec = null;
  r.onstop = () => {
    if (discard) return;
    const blob = new Blob(recChunks, { type: r.mimeType.split(";")[0] });
    recUrl = URL.createObjectURL(blob);
    downloadBtn.textContent = "⬇ 다운로드 (" + recExt.toUpperCase() + ")";
    replayBtn.disabled = downloadBtn.disabled = false;
    setStatus("경기 영상이 준비됐어요", false);
  };
  if (r.state !== "inactive") r.stop();
}

// 전투가 끝난 뒤 승리 화면까지 잠깐 더 녹화하고 마무리
function onOver() {
  if (!rec) return;
  setStatus("영상 저장 중...", true);
  recTimer = setTimeout(() => stopRecording(false), 2500);
}

function clearReplay() {
  if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = null; }
  replayBtn.disabled = downloadBtn.disabled = true;
  downloadBtn.textContent = "⬇ 다운로드";
  overlay.hidden = true;
  setStatus("전투 후 영상 저장", false);
}

replayBtn.addEventListener("click", () => {
  if (!recUrl) return;
  replayVideo.src = recUrl;
  overlay.hidden = false;
  replayVideo.play();
});
closeOverlay.addEventListener("click", () => {
  replayVideo.pause();
  overlay.hidden = true;
});
downloadBtn.addEventListener("click", () => {
  if (!recUrl) return;
  const a = document.createElement("a");
  a.href = recUrl;
  a.download = "공싸움-" + Date.now() + "." + recExt;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// ===== 버튼 =====
startBtn.addEventListener("click", () => {
  if (running) reset();
  else { running = true; syncUI(); startRecording(); }
});
// ===== 캐릭터 선택 창: 추가 버튼을 누르면 캐릭터 목록이 뜨고, 하나를 고르면 소환 =====
let pickSide = "left";
function openPicker(side) {
  if (over || chars.length >= CONFIG.maxCharacters) return;
  pickSide = side;
  pickerList.innerHTML = "";
  for (const k in TYPES) {
    const t = TYPES[k];
    const b = document.createElement("button");
    b.className = "pick";
    b.textContent = t.name;
    b.addEventListener("click", () => { spawn(k, pickSide); closePicker(); });
    pickerList.appendChild(b);
  }
  picker.hidden = false;
}
function closePicker() { picker.hidden = true; }
addLeft.addEventListener("click", () => openPicker("left"));
addRight.addEventListener("click", () => openPicker("right"));
pickerCancel.addEventListener("click", closePicker);
picker.addEventListener("click", e => { if (e.target === picker) closePicker(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });
syncUI();

// ===== 메인 루프 (고정 시간 간격으로 물리 계산) =====
const FIXED_DT = 1 / 240;
let last = performance.now(), acc = 0;
function loop(now) {
  const rdt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (running && !over) {
    acc += rdt;
    while (acc >= FIXED_DT) {
      step(FIXED_DT);
      acc -= FIXED_DT;
      if (over) break;
    }
  }
  updateFx(rdt);
  draw();
  timerEl.textContent = fmt(time);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
